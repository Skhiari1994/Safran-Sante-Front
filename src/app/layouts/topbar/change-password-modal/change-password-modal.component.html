<form [formGroup]="form" (ngSubmit)="enregistrer()" novalidate>
  <div class="modal-header">
    <h5 class="modal-title" id="cp-titre"><i class="ri-lock-password-line me-2" aria-hidden="true"></i>Gérer mon compte</h5>
    <button type="button" class="btn-close" aria-label="Fermer" (click)="modal.dismiss()"></button>
  </div>

  <div class="modal-body" aria-labelledby="cp-titre">
    <p class="cp-intro">Modifier mon mot de passe</p>

    <div class="alert alert-danger py-2" role="alert" *ngIf="erreur">{{ erreur }}</div>

    <!-- Ancien mot de passe -->
    <div class="mb-3">
      <label class="form-label" for="cp-ancien">Ancien mot de passe</label>
      <div class="input-group">
        <input id="cp-ancien" class="form-control" formControlName="currentPassword" autocomplete="current-password"
          [type]="visible.currentPassword ? 'text' : 'password'" [class.is-invalid]="invalide('currentPassword')"
          [attr.aria-invalid]="invalide('currentPassword')" />
        <button type="button" class="btn btn-outline-secondary" (click)="basculer('currentPassword')"
          [attr.aria-label]="visible.currentPassword ? 'Masquer l\'ancien mot de passe' : 'Afficher l\'ancien mot de passe'">
          <i [class]="visible.currentPassword ? 'ri-eye-off-line' : 'ri-eye-line'" aria-hidden="true"></i>
        </button>
        <div class="invalid-feedback" *ngIf="invalide('currentPassword')">L'ancien mot de passe est requis.</div>
      </div>
    </div>

    <!-- Nouveau mot de passe -->
    <div class="mb-2">
      <label class="form-label" for="cp-nouveau">Nouveau mot de passe</label>
      <div class="input-group">
        <input id="cp-nouveau" class="form-control" formControlName="newPassword" autocomplete="new-password"
          [type]="visible.newPassword ? 'text' : 'password'" [class.is-invalid]="invalide('newPassword')"
          [attr.aria-invalid]="invalide('newPassword')" aria-describedby="cp-regles" />
        <button type="button" class="btn btn-outline-secondary" (click)="basculer('newPassword')"
          [attr.aria-label]="visible.newPassword ? 'Masquer le nouveau mot de passe' : 'Afficher le nouveau mot de passe'">
          <i [class]="visible.newPassword ? 'ri-eye-off-line' : 'ri-eye-line'" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- Règles : se cochent en direct pendant la saisie -->
    <ul class="cp-regles" id="cp-regles" aria-live="polite">
      <li *ngFor="let r of regles" [class.ok]="r.respectee(nouveau)">
        <i [class]="r.respectee(nouveau) ? 'ri-checkbox-circle-fill' : 'ri-checkbox-blank-circle-line'" aria-hidden="true"></i>
        <span>{{ r.texte }}</span>
        <span class="visually-hidden">{{ r.respectee(nouveau) ? ' — respecté' : ' — non respecté' }}</span>
      </li>
    </ul>

    <!-- Confirmation -->
    <div class="mb-1">
      <label class="form-label" for="cp-confirmation">Confirmer le mot de passe</label>
      <div class="input-group">
        <input id="cp-confirmation" class="form-control" formControlName="confirmationPassword" autocomplete="new-password"
          [type]="visible.confirmationPassword ? 'text' : 'password'"
          [class.is-invalid]="invalide('confirmationPassword') || confirmationDifferente()"
          [attr.aria-invalid]="invalide('confirmationPassword') || confirmationDifferente()" />
        <button type="button" class="btn btn-outline-secondary" (click)="basculer('confirmationPassword')"
          [attr.aria-label]="visible.confirmationPassword ? 'Masquer la confirmation' : 'Afficher la confirmation'">
          <i [class]="visible.confirmationPassword ? 'ri-eye-off-line' : 'ri-eye-line'" aria-hidden="true"></i>
        </button>
        <div class="invalid-feedback" *ngIf="invalide('confirmationPassword')">La confirmation est requise.</div>
        <div class="invalid-feedback" *ngIf="!invalide('confirmationPassword') && confirmationDifferente()">
          La confirmation ne correspond pas au nouveau mot de passe.
        </div>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-light" (click)="modal.dismiss()">Annuler</button>
    <button type="submit" class="btn btn-primary" [disabled]="enCours || form.invalid">
      <span class="spinner-border spinner-border-sm me-1" *ngIf="enCours" aria-hidden="true"></span>
      Enregistrer
    </button>
  </div>
</form>
