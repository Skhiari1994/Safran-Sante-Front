<!-- start page title -->
<div class="row">
    <div class="col-12">
        <div class="page-title-box titre-page d-flex align-items-center gap-3">
            <span class="titre-page__icone" aria-hidden="true">
                <i [class]="icon"></i>
            </span>
            <div class="min-w-0">
                <h4 class="titre-page__titre mb-0">{{title}}</h4>
                <ol *ngIf="breadcrumbItems?.length" class="breadcrumb titre-page__chemin m-0" aria-label="Fil d'Ariane">
                    @for(item of breadcrumbItems;track $index){
                    <ng-container>
                        <li class="breadcrumb-item" [ngClass]="{'active': item.active == true}"
                            [attr.aria-current]="item.active == true ? 'page' : null">{{ item.label }}
                        </li>
                    </ng-container>
                    }
                </ol>
            </div>
        </div>
    </div>
</div>
<!-- end page title -->
