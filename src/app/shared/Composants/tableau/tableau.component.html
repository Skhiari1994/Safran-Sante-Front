<div class="table-container" >
  <div class="button-container" style="float: inline-end;" >
    <button class="add-row-button" (click)="addNewEmptyRow()">
      <i class="bx bx-add-to-queue"></i>
    </button>
  </div>

  
  <div class="table-container">
    <!-- Table Container -->
    <div class="table-scroll-container" *ngIf="config?.columns">
      <table style="table-layout: fixed; width: 100%;">
        <!-- Table Header avec les champs de recherche -->
        <thead>
          <!-- Ligne pour les champs de recherche -->
          <tr class="search-row">
            <th *ngFor="let column of config.columns" [ngStyle]="{ width: column.width || 'auto', padding: '0', margin: '0' }">
              <input
               *ngIf="column.searchable"
                type="text"
                class="search-input"
                [placeholder]="'Search ' + column.header"
                [(ngModel)]="searchFields[column.field]"
                (input)="onSearch()"
              />
            </th>
            <th style="width: 50px; padding: 0;" *ngIf="config.ISDeleted"></th>
          </tr>
        
          <!-- Ligne pour les en-têtes de colonnes -->
          <tr>
            <th *ngFor="let column of config.columns" [ngStyle]="{ width: column.width || 'auto' }">
              <div class="column-header" (click)="sortData(column)">
                {{ column.header }}
                <span class="sort-icons">
                  <i class="bx bx-up-arrow"></i>
                  <i class="bx bx-down-arrow"></i>
                </span>
              </div>
            </th>
            <th style="width: 100px;" *ngIf="config.ISDeleted">Supp.</th>
          </tr>
        </thead>
        
        
        
  
        <!-- Table Body -->
        <tbody>
          <tr *ngFor="let row of filteredRows; let i = index" [formGroup]="row">
            <td *ngFor="let column of config.columns"
                [ngStyle]="{ width: column.width || 'auto' }"
                [attr.data-label]="column.header">
              <!-- Check if the field should be ignored in form controls -->
              <ng-container *ngIf="column.ignoreInForm; else formField">
                <span>{{ row.get(column.field)?.value }}</span>
              </ng-container>
              
              <ng-template #formField>
                <ng-container [ngSwitch]="true">
                  <!-- Render Select if column has selectOptions -->
                  <ng-container *ngSwitchCase="!!column.selectOptions">
                    <select 
                      [formControlName]="column.field" 
                      [disabled]="!row.get('isEditing')?.value"
                      (change)="column.onChange ? column.onChange($event.target.value, row) : null"
                    >
                      <option *ngFor="let option of column.selectOptions" [value]="option.value">
                        {{ option.label }}
                      </option>
                    </select>
                  </ng-container>
  
                  <!-- Render LovComponent if the column has isLov enabled -->
                  <ng-container *ngSwitchCase="column.isLov">
                    <app-lov
                      [listData]="column.lovList"
                      [columns]="column.lovColumns"
                      [placeholder]="column.placeholder || 'Search...'"
                      [codeField]="column.field"
                      [selectedCode]="row.get(column.field)?.value"
                      [selectedItem]="column.selectOptions"
                      (selectedValue)="onLovSelected($event, row, column.field, column.lovField)"
                    ></app-lov>
                  </ng-container>
  
                  <!-- Render text input or date input for other cases -->
                  <ng-container *ngSwitchDefault>
                    <input
                      *ngIf="column.editable && !column.selectChamp"
                      [formControlName]="column.field"
                      [type]="column.type || 'text'"
                      [placeholder]="column.placeholder || column.header"
                      [disabled]="!row.get('isEditing')?.value"
                      (change)="column.onChange ? column.onChange($event.target.value, row) : null"
                      [ngClass]="{
                        'myDateField': column.format === 'date',
                        'code': column.natureChamp === 'code'
                      }"
                    />
                  </ng-container>
                </ng-container>
              </ng-template>
            </td>
            
            <!-- Action Buttons -->
            <td class="button-container" *ngIf="config.ISDeleted" >

              <a class="text-danger d-inline-block remove-item-btn" data-bs-toggle="modal" (click)="deleteRow(i)">
                <i class="ri-delete-bin-5-fill fs-16"></i>
            </a>
              <!-- <button class="delete-button" (click)="deleteRow(i)"><i class="bx bx-trash"></i></button> -->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  

</div>  
<ng-template #deletemodal role="document" let-modal>
  <div class="modal-body p-5 text-center">
      <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop" colors="primary:#405189,secondary:#f06548" style="width:90px;height:90px">
      </lord-icon>
      <div class="mt-4 text-center">
          <h4>You are about to delete a order ?</h4>
          <p class="text-muted fs-15 mb-4">Deleting your order will remove all of your
              information from our database.</p>
          <div class="hstack gap-2 justify-content-center remove">
              <button class="btn btn-link link-success fw-medium text-decoration-none" id="deleteRecord-close" data-bs-dismiss="modal" (click)="modal.dismiss('close click')"><i class="ri-close-line me-1 align-middle"></i> Close</button>
              <button class="btn btn-danger" id="delete-record" (click)="deleteData(deleteId)">Yes,
                  Delete
                  It</button>
          </div>
      </div>
  </div>
</ng-template>
