<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
  <app-breadcrumbs title="Liste des adhérents"></app-breadcrumbs>
</div>

<div class="col-xl-12">
  <div class="card mt-4 mb-4">
    <div class="card-header border-bottom-dashed d-flex align-items-center gap-3">
      <div class="avatar-sm flex-shrink-0">
        <span class="avatar-title rounded bg-primary-subtle text-primary fs-4"><i class="ri-group-line" aria-hidden="true"></i></span>
      </div>
      <div>
        <h5 class="card-title mb-0">Liste des adhérents</h5>
        <p class="text-muted fs-13 mb-0">Édition de la liste des adhérents selon la plage, le département, le corps et le motif de départ</p>
      </div>
    </div>

    <form action="javascript:void(0);" [formGroup]="formAdherent" autocomplete="off">
      <div class="card-body">
        <div class="row g-3">

          <div class="col-12 ">
            <h6 class="text-muted text-uppercase fs-12 fw-semibold border-bottom pb-2 mb-0">Plage de matricules</h6>
          </div>
          <div class="col-lg-6">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Matricule début</label>
                <app-lov [listData]="personnelList" [columns]="columnsSearch" codeField="mat_pers"
                  [selectedCode]="formAdherent.get('mat_pers_deb')?.value" (selectedValue)="onSelectedVMat($event)"></app-lov>
              </div>
              <div class="col-md-8">
                <label for="nom-deb" class="form-label">Nom et prénom</label>
                <input id="nom-deb" type="text" class="form-control" placeholder="Nom et prénom" formControlName="nom_deb" readonly />
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Matricule fin</label>
                <app-lov [listData]="personnelList" [columns]="columnsSearch" codeField="mat_pers"
                  [selectedCode]="formAdherent.get('mat_pers_fin')?.value" (selectedValue)="onSelectedVMat2($event)"></app-lov>
              </div>
              <div class="col-md-8">
                <label for="nom-fin" class="form-label">Nom et prénom</label>
                <input id="nom-fin" type="text" class="form-control" placeholder="Nom et prénom" formControlName="nom_fin" readonly />
              </div>
            </div>
          </div>

          <div class="col-12 mt-4">
            <h6 class="text-muted text-uppercase fs-12 fw-semibold border-bottom pb-2 mb-0">Filtres</h6>
          </div>
          <div class="col-md-3">
            <label class="form-label">Département</label>
            <app-lov [listData]="listLieu" [columns]="columnsLieu" codeField="cod_lieu_geog"
              [selectedCode]="codLieuVal" (selectedValue)="onSelectedValueLieu($event)"></app-lov>
          </div>
          <div class="col-md-6">
            <label for="lib-lieu" class="form-label">Libellé département</label>
            <input id="lib-lieu" type="text" class="form-control" placeholder="Département" [value]="libLieu" readonly />
          </div>
          <div class="col-md-3">
            <label for="etat" class="form-label">État</label>
            <select id="etat" class="form-select" formControlName="etat_act">
              <option value="">Tous</option>
              <option value="A">Actif</option>
              <option value="B">Bloqué</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="corps" class="form-label">Corps</label>
            <select id="corps" class="form-select" formControlName="corps">
              <option value="">Tous</option>
              <option *ngFor="let i of listCorps" [value]="i.cod_corps">{{ i.lib_corps }}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Motif de départ</label>
            <app-lov [listData]="listTypeDepart" [columns]="columnsTypDepart" codeField="cod_typ_depart"
              [selectedCode]="codTypDepartVal" (selectedValue)="onSelectedValueTypDepart($event)"></app-lov>
          </div>
          <div class="col-md-5">
            <label for="lib-depart" class="form-label">Libellé du motif de départ</label>
            <input id="lib-depart" type="text" class="form-control" placeholder="Motif de départ" [value]="libTypDepart" readonly />
          </div>
        </div>
      </div>

      <div class="card-footer text-muted fs-13 d-flex align-items-center gap-2">
        <i class="ri-printer-line fs-16" aria-hidden="true"></i>
        Renseignez les critères puis lancez l'impression depuis la barre d'outils pour générer le PDF.
      </div>
    </form>
  </div>
</div>
