<div class="col-md-12">
  <div class="collapse show" id="paymentmethodCollapse">
    <div class="card p-4 border shadow-none mb-0 mt-4">
      <form
        action="javascript:void(0);"
        class="row g-3"
        [formGroup]="formAdherent"
      >
        <div class="row">
          <div class="col-md-6">
            <!-- Bloc 1 -->
            <div class="row">
              <div class="col-md-2">
                <label class="form-label">Matricule début</label>
                <app-lov
                  [listData]="personnelList"
                  [columns]="columnsSearch"
                  codeField="mat_pers"
                  [selectedCode]="formAdherent.get('mat_pers')?.value"
                  (selectedValue)="onSelectedVMat($event)"
                ></app-lov>
              </div>
              <div class="col-md-2">
                <label class="form-label">N°CNRPS</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="num_retr_deb"
                  readonly
                />
              </div>
              <div class="col-md-5">
                <label class="form-label">Nom</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="nom_deb"
                  readonly
                />
              </div>
            </div>

            <!-- Bloc 2 -->
            <div class="row mt-3">
              <div class="col-md-2">
                <label class="form-label">Matricule fin</label>
                <app-lov
                  [listData]="personnelList"
                  [columns]="columnsSearch"
                  codeField="mat_pers"
                  [selectedCode]="formAdherent.get('mat_pers2')?.value"
                  (selectedValue)="onSelectedVMat2($event)"
                ></app-lov>
              </div>
              <div class="col-md-2">
                <label class="form-label">N°CNRPS</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="num_retr_fin"
                  readonly
                />
              </div>
              <div class="col-md-5">
                <label class="form-label">Nom</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="nom_fin"
                  readonly
                />
              </div>

            
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
