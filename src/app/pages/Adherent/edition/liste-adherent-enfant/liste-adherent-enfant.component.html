<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
  <app-breadcrumbs title="Liste des enfants par adhérent"></app-breadcrumbs>
</div>

<div class="col-xl-12">
  <div class="card mt-4 mb-4">
    <div class="card-header border-bottom-dashed d-flex align-items-center gap-3">
      <div class="avatar-sm flex-shrink-0">
        <span class="avatar-title rounded bg-primary-subtle text-primary fs-4"><i class="ri-parent-line" aria-hidden="true"></i></span>
      </div>
      <div>
        <h5 class="card-title mb-0">Liste des enfants par adhérent</h5>
        <p class="text-muted fs-13 mb-0">Édition de la liste des enfants selon une tranche d'âge</p>
      </div>
    </div>

    <form action="javascript:void(0);" [formGroup]="formAdherent" autocomplete="off">
      <div class="card-body">
        <div class="row g-3">

          <div class="col-12 ">
            <h6 class="text-muted text-uppercase fs-12 fw-semibold border-bottom pb-2 mb-0">Tranche d'âge</h6>
          </div>
          <div class="col-md-3">
            <label for="age-deb" class="form-label">Âge début</label>
            <input id="age-deb" type="text" inputmode="numeric" class="form-control" placeholder="Ex. 0" formControlName="age_deb" />
          </div>
          <div class="col-md-3">
            <label for="age-fin" class="form-label">Âge fin</label>
            <input id="age-fin" type="text" inputmode="numeric" class="form-control" placeholder="Ex. 20" formControlName="age_fin" />
          </div>
        </div>
      </div>

      <div class="card-footer text-muted fs-13 d-flex align-items-center gap-2">
        <i class="ri-printer-line fs-16" aria-hidden="true"></i>
        Renseignez les critères puis lancez l'impression depuis la barre d'outils pour générer le PDF.
      </div>
    </form>
  </div>
</div>
