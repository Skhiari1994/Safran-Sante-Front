<div class="row" style="margin-top: 25px"></div>
<app-breadcrumbs
  title="Mise à jour adhérent"
  [breadcrumbItems]="breadCrumbItems"
></app-breadcrumbs>
<div class="row">

  <div class="col-xl-10">
    <div class="card" [formGroup]="formAdherent" >
      <div class="container">
        <!-- Row: Entire Form -->
        <div class="row mb-1 align-items-center">
          <!-- Matricule -->
          <div class="col-md-2">
            <label for="code" class="form-label">Matricule</label>
          </div>
          <div id="fixed-width-matricule">
            <input
              type="text"
              class="form-control"
              id="code"
              placeholder="Enter Matricule"
              formControlName="mat_pers"
              (change)="checkMatricule($event)"
            />
            <div *ngIf="errorMessageMat" class="error-message">{{ errorMessageMat }}</div>
          </div>
          <div class="col-md-2"></div>
          <div class="col-sm-2">
            <label for="code" class="form-label">Matricule admin</label>
          </div>
          <div id="fixed-width-lov">
            <app-lov
              [listData]="listMatInt"
              [columns]="columnsMatInt"
              codeField="matInt"
              [selectedCode]="codMatIntVal"
              (selectedValue)="onSelectedVMatInt($event)"
            ></app-lov>
            </div>
 
        </div>
  
        <div class="row mb-1 align-items-center">
          <!-- Prénom -->

          <div class="col-md-2">
            <label for="nom" class="form-label">Nom</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Nom"
              formControlName="nom_pers"
            />
          </div>
          <div class="col-md-2">
            <label for="prenom" class="form-label">Prénom</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Prénom"
              formControlName="pren_pers"
            />
          </div>
  
          <!-- Nom Arabe -->
         
        </div>
  
        <div class="row mb-1 align-items-center">
          <div class="col-md-2">
            <label for="nom_arabe" class="form-label">Nom Arabe</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Nom Arabe"
              formControlName="nom_pers_a"
            />
          </div>
          <!-- Prénom Arabe -->
          <div class="col-md-2">
            <label for="prenom_arabe" class="form-label">Prénom Arabe</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Prénom Arabe"
              formControlName="pren_pers_a"
            />
          </div>
  
          <!-- Nom jeune fille -->
         
        </div>
  
        <div class="row mb-1 align-items-center">
          <div class="col-md-2">
            <label for="nom_jeune_fille" class="form-label">Nom jeune fille</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Nom jeune fille"
              formControlName="nom_jf"
            />
          </div>
          <!-- Nom jeune fille Arabe -->
          <div class="col-md-2">
            <label for="nom_jeune_fille_arabe" class="form-label">Nom jeune fille Arabe</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Nom jeune fille Arabe"
              formControlName="nom_jf_a"
            />
          </div>
  
          <!-- Date de naissance -->
          
        </div>
  
        <div class="row mb-1 align-items-center">
          <div class="col-md-2">
            <label for="date_naissance" class="form-label">Date de naissance</label>
          </div>
          <div id="fixed-width-date">
            <input
              type="text"
              class="form-control"
              id="myDateField"
              mask="00/00/0000"
              placeholder="Enter Date de naissance"
              formControlName="dat_nais"
              appDateFormatter
            />
          </div>
          <div class="col-md-2"></div>
          <!-- Lieu de naissance -->
          <div class="col-md-2">
            <label for="lieu_naissance" class="form-label">Lieu de naissance</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter Lieu de naissance"
              formControlName="lieu_nais"
            />
          </div>
  
          <!-- Sexe -->

        </div>
  
        <div class="row mb-1 align-items-center">
          <!-- CIN -->
          <div class="col-md-2">
            <label for="sexe" class="form-label">Sexe</label>
          </div>
          <div id="fixed-width-label">
            <select class="form-select" id="select" formControlName="sexe">
              <option value=""></option>
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="cin" class="form-label">CIN</label>
          </div>
          <div id="fixed-width-label">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Enter CIN"
              formControlName="cin"
              mask="00000000"
            />
          </div>
  
          <!-- Nationalité -->

        </div>

        <div class="row mb-1 align-items-center">
         
          <div class="col-md-2">
            <label for="nationalite" class="form-label">Nationalité</label>
          </div>
          <div id="fixed-width-lov">
            <app-lov
              [listData]="listNationalite"
              [columns]="columnsNat"
              codeField="cod_natp"
              [selectedCode]="codNatP"
              (selectedValue)="onSelectedValueNat($event)"
            ></app-lov>
            </div>
            <div id="fixed-width-input-display">
            <input
              type="text"
              class="form-control mt-2"
              [value]="libNat"
              id="display-input"
              readonly
              placeholder="Nationalité sélectionnée"
            />
          </div>
        </div>
        <div class="row mb-1 align-items-center">
         
          <div class="col-md-2">
            <label for="departement" class="form-label">Département</label>
          </div>
          <div id="fixed-width-lov">
            <app-lov
            [listData]="listLieu"
            [columns]="columnsLieu"
            codeField="cod_lieu_geog"
            [selectedCode]="codLieuVal"
            (selectedValue)="onSelectedValueLieu($event)"
          ></app-lov>
            </div>
            <div id="fixed-width-input-display">
              <input
              type="text"
              class="form-control mt-2"
              [value]="libLieu"
              id="display-input"

              readonly
              placeholder="Département sélectionné"
            />
        </div>
     
      </div>

      <div class="row mb-1 align-items-center">
        <div class="col-md-2">
          <label for="date_embauche" class="form-label">Date d'embauche</label>
        </div>
        <div id="fixed-width-date">
          <input
            type="text"
            class="form-control"
            id="myDateField"
            mask="00/00/0000"
            placeholder="Enter Date d'embauche"
            formControlName="dat_emb"
            appDateFormatter
          />
        </div>
        <div class="row mt-3">
          <div class="col-md-3">
            <label for="situation_sociale" class="form-label">Situation sociale</label>
         
             <div id="fixed-width-select">
              <select
                class="form-select"
                id="select"
                formControlName="cod_sit"
              >
                <option value=""></option>
                <option value="C">Célibataire</option>
                <option value="M">Marié(e)</option>
                <option value="D">Divorcé(e)</option>
                <option value="V">Veuf(ve)</option>
              </select>
          </div>
        </div>
        <div  class="row" *ngIf="
        formAdherent.get('cod_sit')?.value === 'M' ||
        formAdherent.get('cod_sit')?.value === 'D'
      ">
      <div class="col-md-2">
            <label for="nb_enfants" class="form-label">Nombre d'enfants</label>
          </div>
            <div id="fixed-width-lov">
              <input
                type="number"
                class="form-control"
                id="code"
                placeholder="Enter Nombre d'enfants"
                formControlName="nbr_enf"
                readonly
              />
            </div>
            </div>
        </div>

               
 
      </div>
</div> 
    </div>


    <div class="col-xl-12">
      <div class="card">
 
          <div class="card-body form-steps">
               
              <ng-stepper #cdkStepper [linear]="false" class="step-arrow-nav wizard">
                  <cdk-step [optional]="false">
                      <ng-template cdkStepLabel>
                          <li class="nav-item" role="presentation">
                              <button class="nav-link done" id="steparrow-gen-info-tab" data-bs-toggle="pill"
                                  data-bs-target="#steparrow-gen-info" type="button" role="tab"
                                  aria-controls="steparrow-gen-info" aria-selected="true">Info de base</button>
                          </li>
                      </ng-template>


                      
                      <div class="col-md-12" [formGroup]="formAdherent"  >
                        <div class="collapse show" id="paymentmethodCollapse">
                          <div
                          class="container d-flex justify-content-center align-items-center"
                        >
                        <div class="card-body">
                          <div class="row">
                            <div id="fixed-width-select">
                              <div class="mb-3">
                                <label for="country" class="form-label"
                                  >Corps</label
                                >
                                <select
                                  class="form-select"
                                  id="select"
                                  data-plugin="choices"
                                  formControlName="corps"
                                >
                                  <option value=""></option>
                                  <option value="C">Cadre commun</option>
                                  <option value="S">Sécurité</option>
                                  <option value="M">
                                    Mediateur administratif
                                  </option>
                                  <option value="H">HCCAF</option>
                                  <option value="I">ITES</option>
                                  <option value="P">Minéstère d'intérieur</option>
                                  <option value="D">Divers</option>
                                </select>
                              </div>
                            </div>
  
                            <div class="col-sm-2">
                            </div>
  
                            <div id="fixed-width-select">
                              <div class="mb-3">
                                <label
                                  for="billinginfo-lastName"
                                  class="form-label"
                                  >Etat</label
                                >
                                <select
                                  class="form-select"
                                  id="select"
                                  data-plugin="choices"
                                  formControlName="etat_act"
                                >
                                  <option value=""></option>
                                  <option value="A">Actif</option>
                                  <option value="B">Bloqué</option>
                                  <option value="I">En Instance</option>
                                </select>
                              </div>
                            </div>
                          </div>
  
                          <div class="row">
                            <div id="fixed-width-lov">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Pos. admin
                                </label>
                                <div class="mb-4">
                                  <app-lov
                                    [listData]="listAffectation"
                                    [columns]="columnAffect"
                                    [codeField]="codAffect"
                                    [selectedCode]="codAffectVal"
                                    (selectedValue)=" onSelectedValueAffect($event) "
                                  >
                                  </app-lov>
                                </div>
                              </div>
                            </div>
                            
                            <div id="fixed-width-input-display">
                              <div class="mb-3">
                                <label
                                  for="billinginfo-lastName"
                                  class="form-label"
                                >
                                </label>
                                <input
                                  type="text"
                                  class="form-control"
                                  id="display-input"
                                  placeholder="Lib Affectation"
                                  [value]="libAffect"
                                  readonly
                                />
                              </div>
                            </div>
                            <div id="fixed-width-date">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Date Pos.</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  id="myDateField"
                                  mask="00/00/0000"
                                  placeholder="Entrer Date motif"
                                  formControlName="dat_affect"
                                  appDateFormatter
                                />
                              </div>
                            </div>
                          </div>
                          <div class="row">
                            <div id="fixed-width-lov">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Motif départ</label
                                >
                                <div class="mb-3">
                                  <app-lov
                                    [listData]="listTypeDepart"
                                    [columns]="columnsTypDepart"
                                    [codeField]="codTypDepart"
                                    [selectedCode]="codTypDepartVal"
                                    (selectedValue)="
                                      onSelectedValueTypDepart($event)
                                    "
                                  >
                                  </app-lov>
                                </div>
                              </div>
                            </div>
  
                            <div id="fixed-width-input-display">
                              <label
                                for="billinginfo-phone"
                                class="form-label"
                              ></label>
                              <div class="mb-3">
                                <input
                                  type="text"
                                  class="form-control"
                                  id="display-input"
                                  placeholder="Type départ"
                                  [value]="libTypDepart"
                                  readonly
                                />
                              </div>
                            </div>
                            <div id="fixed-width-date">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label">Date motif</label>
                                <input
                                  type="text"
                                  class="form-control"
                                  id="myDateField"
                                  mask="00/00/0000"
                                  placeholder="Entrer Date motif"
                                  formControlName="dat_depart"
                                  appDateFormatter
                                />
                              </div>
                            </div>
                            
                          </div>
                          <div class="row">
                            <div id="fixed-width-label">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Num affil mutuelle</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  id="code"
                                  placeholder="Num affil mutuelle"
                                  formControlName="num_assur"
                                />
                              </div>
                            </div>
                            <div id="fixed-width-select">
                              <div class="mb-3">
                                <label for="country" class="form-label"
                                  >Etat adhésion</label
                                >
                                <select
                                  class="form-select"
                                  id="select"
                                  data-plugin="choices"
                                  formControlName="typ_aff"
                                >
                                  <option value=""></option>
                                  <option value="A">Adhéré</option>
                                  <option value="S">Non Adhéré</option>
                                </select>
                              </div>
                            </div>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                            <div id="fixed-width-date">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Date effet</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  id="myDateField"
                                  mask="00/00/0000"
                                  placeholder="Entrer Date effet"
                                  formControlName="dat_ass"
                                  appDateFormatter
                                />
                              </div>
                            </div>
                          </div>
  
                          <div class="row">
                            <div id="fixed-width-select">
                              <div class="mb-3">
                                <label for="country" class="form-label"
                                  >Caisse de retraite</label
                                >
                                <select
                                  class="form-select"
                                  id="select"
                                  data-plugin="choices"
                                  formControlName="cod_retr"
                                >
                                  <option value=""></option>
                                  <option value="1">CNSS</option>
                                  <option value="2">CNRPS</option>
                                </select>
                              </div>
                            </div>
                            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                            <div id="fixed-width-label">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Identifiant unique CNRPS</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  id="code"
                                  placeholder="Entrer Identifiant unique CNRPS"
                                  formControlName="num_retr"
                                />
                              </div>
                            </div>
                            <div id="fixed-width-date">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >D.aff CNAM</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  mask="00/00/0000"
                                  id="myDateField"
                                  placeholder="Entrer Date affiliation CNAM"
                                  formControlName="dat_aff_cnam"
                                  appDateFormatter
                                />
                              </div>
                            </div>
                          </div>
                          <div class="row">
                            <div id="fixed-width-label">
                              <div class="mb-3">
                                <label for="country" class="form-label"
                                  >Lib fil</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  id="input"
                                  placeholder="Entrer Lib fil"
                                />
                              </div>
                            </div>
  
                            <div class="col-sm-1"></div>
                            <div id="fixed-width-label">
                              <div class="mb-3">
                                <label for="billinginfo-phone" class="form-label"
                                  >Assiette cot.</label
                                >
                                <input
                                  type="text"
                                  class="form-control"
                                  id="code"
                                  placeholder="Assiette cot."
                                  formControlName="mnt_param"
                                />
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                          
                  
                        </div>
                      </div>
            
                  </cdk-step>

                  <cdk-step [optional]="false">
                      <ng-template cdkStepLabel>
                          <li class="nav-item" role="presentation">
                              <button class="nav-link active" id="steparrow-description-info-tab"
                                  data-bs-toggle="pill" data-bs-target="#steparrow-description-info" type="button"
                                  role="tab" aria-controls="steparrow-description-info"
                                  aria-selected="false">Mode de payement</button>
                          </li>
                      </ng-template>
                      <div
                      class="container d-flex justify-content-center align-items-center"
                    >
                      <div class="col-md-8" [formGroup]="formAdherent">
                        <div class="collapse show" id="paymentmethodCollapse">
                          <div class="card p-5 border shadow-none mb-0 mt-5">
                            <div class="row">
                              <div id="fixed-width-select">
                                <div class="mb-3">
                                  <label for="country" class="form-label"
                                    >Mode de payement</label
                                  >
                                  <select
                                    class="form-select"
                                    id="select"
                                    data-plugin="choices"
                                    formControlName="cod_pay"
                                  >
                                    <option value=""></option>
                                    <option value="V">Virement</option>
                                    <option value="E">Espèce</option>
                                    <option value="C">Chèque</option>
                                  </select>
                                </div>
                              </div>
    
                              <div class="col-sm-2">
                                <div class="mb-3"></div>
                              </div>
    
                              <div id="fixed-width-select">
                                <div class="mb-3">
                                  <label
                                    for="billinginfo-lastName"
                                    class="form-label"
                                    >Carte banquaire</label
                                  >
                                  <select
                                    class="form-select"
                                    id="select"
                                    data-plugin="choices"
                                    formControlName="pers_carte"
                                  >
                                    <option value=""></option>
                                    <option value="O">Oui</option>
                                    <option value="N">Non</option>
                                  </select>
                                </div>
                              </div>
                            </div>
    
                            <div class="row">
                              <div id="fixed-width-lov">
                                <div class="mb-3">
                                  <label for="billinginfo-phone" class="form-label"
                                    >Banque
                                  </label>
                                  <div class="mb-4">
                                    <app-lov
                                      [listData]="listBanque"
                                      [columns]="columnBanque"
                                      [codeField]="codBanque"
                                      [selectedCode]="codBanqueVal"
                                      (selectedValue)="
                                        onSelectedValueBanque($event)
                                      "
                                    >
                                    </app-lov>
                                  </div>
                                </div>
                              </div>
    
                              <div id="fixed-width-input-display">
                                <div class="mb-3">
                                  <label
                                    for="billinginfo-lastName"
                                    class="form-label"
                                  >
                                  </label>
                                  <input
                                    type="text"
                                    class="form-control"
                                    id="display-input"
                                    placeholder="Banque"
                                    [value]="libBanque"
                                    readonly
                                  />
                                </div>
                              </div>
                            </div>
                            <div class="row">
                              <div id="fixed-width-lov">
                                <div class="mb-3">
                                  <label for="billinginfo-phone" class="form-label"
                                    >Agence
                                  </label>
                                  <div class="mb-4">
                                    <app-lov
                                      [listData]="listAgence"
                                      [columns]="columnsAgence"
                                      [codeField]="codAgence"
                                      [selectedCode]="codAgenceVal"
                                      (selectedValue)="
                                        onSelectedValueAgence($event)
                                      "
                                    >
                                    </app-lov>
                                  </div>
                                </div>
                              </div>
    
                              <div id="fixed-width-input-display">
                                <div class="mb-3">
                                  <label
                                    for="billinginfo-lastName"
                                    class="form-label"
                                  >
                                  </label>
                                  <input
                                    type="text"
                                    class="form-control"
                                    id="display-input"
                                    placeholder="Agence"
                                    [value]="libAgence"
                                    readonly
                                  />
                                </div>
                              </div>
                            </div>
    
                            <div class="row">
                              <div class="col-sm-7">
                                <div class="mb-3">
                                  <label for="billinginfo-phone" class="form-label"
                                    >RIB</label
                                  >
                                  <input
                                    type="text"
                                    class="form-control"
                                    id="input"
                                    placeholder="Entrer RIB"
                                    formControlName="rib"
                                  />
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
 
                  </cdk-step>

                  <cdk-step [optional]="false">
                      <ng-template cdkStepLabel>
                          <li class="nav-item" role="presentation">
                              <button class="nav-link" id="pills-experience-tab" data-bs-toggle="pill"
                                  data-bs-target="#pills-experience" type="button" role="tab"
                                  aria-controls="pills-experience" aria-selected="false">Famille</button>
                          </li>
                      </ng-template>
                      <div class="row">
                        <!-- First Card -->
                        <div class="col-md-6">
                          <div class="collapse show" id="paymentmethodCollapse">
                            <h5 class="mb-1">Père</h5>
      
                            <div
                              class="card p-4 border shadow-none mb-0 mt-4"
                              [formGroup]="formPere"
                            >
                              <div class="row gy-3">
                                <div class="col-md-6">
                                  <label for="cc-name" class="form-label">Nom </label>
                                  <input
                                    type="text"
                                    class="form-control"
                                    id="input"
                                    placeholder="Enter name"
                                    formControlName="nom_pren"
                                  />
                                </div>
      
                                <div id="fixed-width-date">
                                  <label for="cc-number" class="form-label"
                                    >Date naiss.</label

<!-- removeItemModal -->
<ng-template #deleteModel let-modal>
  <div class="modal-content">
    <div class="modal-header">
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
        id="btn-close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>
    <div class="modal-body">
      <div class="mt-2 text-center">
        <lord-icon
          src="https://cdn.lordicon.com/gsqxdxog.json"
          trigger="loop"
          colors="primary:#f7b84b,secondary:#f06548"
          style="width: 100px; height: 100px"
        ></lord-icon>
        <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
          <h4>Are you sure ?</h4>
          <p class="text-muted mx-4 mb-0">
            Are you sure you want to remove this address ?
          </p>
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
        <button
          type="button"
          class="btn w-sm btn-light"
          data-bs-dismiss="modal"
          (click)="modal.close('Close click')"
        >
          Close
        </button>
        <button type="button" class="btn w-sm btn-danger" id="delete-product">
          Yes, Delete It!
        </button>
      </div>
    </div>
  </div>
  <!-- /.modal-content -->
   
</ng-template>
