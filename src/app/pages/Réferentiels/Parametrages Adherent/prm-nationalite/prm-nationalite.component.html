<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
  <app-breadcrumbs
    title="Nationalité"
    [breadcrumbItems]="breadCrumbItems"
  ></app-breadcrumbs>
<br>
<div class="row">
  <!-- Header with Add Button -->
  <div class="card-header">
    <div class="d-flex align-items-center flex-wrap gap-3">
      <div class="flex-grow-1"></div>
      <div class="flex-shrink-0">
        <div class="hstack text-nowrap gap-2">
          <button
            class="btn btn-info add-btn mb-3"
            data-bs-toggle="modal"
            data-bs-target="#showModal"
            (click)="openModalTab(content1)"
          >
            <i class="ri-add-fill me-1 align-bottom"></i> Ajouter Nationalité
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Card Wrapper -->
  <div class="card">
    <div class="card-body">
      <!-- Table -->
      <div class="table-responsive table-card">
        <p-table [value]="listNationalite" [paginator]="true" [rows]="10" styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped modern-table">
          <ng-template pTemplate="header">
            <tr class="table-primary">
              <th *ngFor="let column of ['cod_natp', 'lib_nat', 'lib_nat_a']">
                <div class="d-flex align-items-center">
                  <span class="me-2" (click)="onSort(column)">{{ columnTitles[column] || column }}<i class="ri-arrow-up-down-line ms-1"></i></span>
                  <i class="ri-search-line text-muted ms-2" (click)="toggleFilter(column)"></i>
                  <input *ngIf="showFilters[column]" type="text" class="form-control form-control-sm ms-2" style="width: 100px;" [(ngModel)]="searchz[column]" (input)="applyFilter()" placeholder="..." />
                </div>
              </th>
              <th>Action</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
            <tr>
              <td>{{ rowData.cod_natp }}</td>
              <td>{{ rowData.lib_nat }}</td>
              <td>{{ rowData.lib_nat_a }}</td>
              <td>
                <ul class="list-inline hstack gap-2 mb-0">
                  <li class="list-inline-item">
                    <a class="edit-item-btn" data-bs-toggle="modal" (click)="editDataGet(rowIndex, rowData, content1)"><i class="ri-pencil-fill align-bottom text-muted"></i></a>
                  </li>
                  <li class="list-inline-item me-0" ngbTooltip="Delete" placement="top">
                    <a class="remove-item-btn" data-bs-toggle="modal" (click)="confirm(deleteModel, rowData)"><i class="ri-delete-bin-fill align-bottom text-muted"></i></a>
                  </li>
                </ul>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>

      <div class="d-flex justify-content-end mt-3"></div>
    </div>
  </div>
</div>

<ng-template #content1 role="document" let-modal>
  <div class="modal-header bg-info-subtle p-3">
    <h5 class="modal-title" id="exampleModalLabel">Ajouter Nationalité</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="modal"
      aria-label="Close"
      id="close-modal"
      (click)="modal.dismiss('Cross click')"
    ></button>
  </div>
  <form [formGroup]="formNationalite" class="tablelist-form" autocomplete="off">
    <div class="modal-body">
   
       <div class="row g-2">
        <div class="col-md-2">
            <label for="billinginfo-phone" class="form-label">Code nation.</label>
            <input
              type="text"
              class="form-control border-warning"
               placeholder="Entrer la date départ"
              formControlName="cod_natp"
              />
          </div>
          <div class="col-md-5">  
            <label for="billinginfo-phone" class="form-label">Libellé nation.</label>     
               <input
            type="text"
            class="form-control border-warning"
             placeholder="lib_nat"
            formControlName="lib_nat"
           /></div>
         <div class="col-md-5">
          <label for="billinginfo-phone" class="form-label">Libellé nation. arab</label>
          <input
            type="text"
            class="form-control border-warning"
             placeholder="lib_nat_a"
            formControlName="lib_nat_a"
           />
        </div>

 
      </div>
    </div>

    <div class="modal-footer">
      <div class="hstack gap-2 justify-content-end">
        <button
          type="button"
          class="btn btn-success"
          data-bs-dismiss="modal"
          (click)="saveDepartPers(); modal.close('Close click')"
        >
          Valider
        </button>
      </div>
      <div class="hstack gap-2 justify-content-end">
        <button
          type="button"
          class="btn btn-light"
          data-bs-dismiss="modal"
          (click)="modal.close('Close click')"
        >
          Close
        </button>
      </div>
    </div>
  </form>
</ng-template>

 
<ng-template #deleteModel let-modal>
    <div class="modal-content">
      <div class="modal-header">
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          id="btn-close"
          (click)="modal.dismiss('Cross click')"
        ></button>
      </div>
      <div class="modal-body">
        <div class="mt-2 text-center">
          <lord-icon
            src="https://cdn.lordicon.com/gsqxdxog.json"
            trigger="loop"
            colors="primary:#f7b84b,secondary:#f06548"
            style="width: 100px; height: 100px"
          ></lord-icon>
          <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
            <h4>Vous êtes sûr ?</h4>
            <p class="text-muted mx-4 mb-0">
              Voulez-vous supprimer nationalité ?
            </p>
          </div>
        </div>
        <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
          <button
            type="button"
            class="btn w-sm btn-light"
            data-bs-dismiss="modal"
            (click)="modal.close('Close click')"
          >
            Fermer
          </button>
          <button type="button" class="btn w-sm btn-danger" id="delete-product" (click)="deleteNationalite()">
            Oui, supprimer!
          </button>
        </div>
      </div>
    </div>
    <!-- /.modal-content -->
  </ng-template>
