<div class="row" style="margin-top: 25px"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px">
<app-breadcrumbs
title="Référentielle des APCI"
[breadcrumbItems]="breadCrumbItems"
></app-breadcrumbs>
<br>
<div class="row">
  <!-- Header with Add Button -->
  <div class="card-header">
    <div class="d-flex align-items-center flex-wrap gap-3">
      <div class="flex-grow-1"></div>
      <div class="flex-shrink-0">
        <div class="hstack text-nowrap gap-2">
          <button
            class="btn btn-info add-btn mb-3"
            data-bs-toggle="modal"
            data-bs-target="#showModal"
            (click)="openModalTab(content1)"
          >
            <i class="ri-add-fill me-1 align-bottom"></i> Ajouter
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <!-- Table -->
      <p-table [value]="listMaladie" [paginator]="true" [rows]="12" styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped modern-table">
        <ng-template pTemplate="header">
          <tr class="table-primary">
            <th *ngFor="let column of ['cod_malad', 'lib_malad', 'lib_malad_a','Mnt seuil', 'apci']">
              <div class="d-flex align-items-center">
                <span class="me-2" (click)="onSort(column)">  {{ columnTitles[column] || column }}
                  <i class="ri-arrow-up-down-line ms-1"></i>
                </span>
                <i class="ri-search-line text-muted ms-2" (click)="toggleFilter(column)"></i>
                <input *ngIf="showFilters[column]" type="text" class="form-control form-control-sm ms-2" style="width: 100px;" [(ngModel)]="searchz[column]" (input)="applyFilter()" placeholder="..." />
              </div>
            </th>
            <th>Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
          <tr [ngClass]="{'bg-light': rowIndex % 2 === 0, 'bg-white': rowIndex % 2 !== 0}">
            <td>{{ rowData.cod_malad }}</td>
            <td>{{ rowData.lib_malad }}</td>
            <td>{{ rowData.lib_malad_a }}</td>
            <td>{{ rowData.mnt_seuil | number: '1.2-3'}} </td>
            <td>{{ rowData.apci=='O'?'Oui':'Non'}} </td>
            <td>
              <ul class="list-inline hstack gap-2 mb-0">
                <li class="list-inline-item">
                  <a class="edit-item-btn" data-bs-toggle="modal" (click)="editDataGet( rowData, content1)">
                    <i class="ri-pencil-fill align-bottom text-muted"></i>
                  </a>
                </li>
                <li class="list-inline-item">
                  <a class="remove-item-btn" data-bs-toggle="modal" (click)="confirm(deleteModel, rowData)">
                    <i class="ri-delete-bin-fill align-bottom text-muted"></i>
                  </a>
                </li>
              </ul>
            </td>
          </tr>
        </ng-template>
      </p-table>

        
      
    </div>
  </div>



</div>
 

<ng-template #content1 role="document" let-modal>
  <div class="modal-header bg-info-subtle p-3">
    <h5 class="modal-title" id="exampleModalLabel">{{edit==true?'Ajouter':'Modifier'}} ref visite</h5>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="modal"
      aria-label="Close"
      id="close-modal"
      (click)="modal.dismiss('Cross click')"
    ></button>
  </div>
  <form
    [formGroup]="formMaladie"
    class="tablelist-form"
    autocomplete="off"
  >
    <div class="modal-body">
      <div class="row g-3">
        <div class="col-md-2">
          <label for="billinginfo-firstName" class="form-label"
            >Code acte</label
          >
          <input
            type="text"
            class="form-control border-primary"
            placeholder="Entrer code acte"
            formControlName="cod_malad"
             
          />      
        </div>
        <div class="col-md-4">
          <label for="billinginfo-firstName" class="form-label">Libelle</label>
          <input
             class="form-control border-primary"
            placeholder="Entrer Libelle"
            formControlName="lib_malad"/>
        </div>

        <div class="col-md-4">
            <label for="billinginfo-firstName" class="form-label">Libelle 2eme langue</label>
            <input
               class="form-control border-primary"
              placeholder="Entrer Libelle 2eme langue"
              formControlName="lib_malad_a"/>
          </div>
          <div class="col-md-2">
            <label for="country" class="form-label">Apci</label>
            <select class="form-select border-success" data-plugin="choices" formControlName="apci">
                <option value="O">Oui</option>
                <option value="N">Non</option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="country" class="form-label">Mnt seuil</label>
            <input
            class="form-control border-primary"
           placeholder="Entrer Libelle 2eme langue"
           formControlName="mnt_seuil"
           appMontantMask />
        </div>
        </div>
        </div>
        <div class="modal-footer">
            <div class="hstack gap-2 justify-content-end">
              <button
                type="button"
                class="btn btn-success"
                data-bs-dismiss="modal"
                (click)="saveMaladie(); modal.close('Close click')"
              >
                Valider
              </button>
            </div>
            <div class="hstack gap-2 justify-content-end">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
                (click)="modal.close('Close click')"
              >
                Close
              </button>
            </div>
          </div>
  </form>
</ng-template>

<ng-template #deleteModel let-modal>
  <div class="modal-content">
    <div class="modal-header">
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
        id="btn-close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>
    <div class="modal-body">
      <div class="mt-2 text-center">
        <lord-icon
          src="https://cdn.lordicon.com/gsqxdxog.json"
          trigger="loop"
          colors="primary:#f7b84b,secondary:#f06548"
          style="width: 100px; height: 100px"
        ></lord-icon>
        <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
          <h4>Êtes-vous sûr ?</h4>
        <p class="text-muted mx-4 mb-0">
          Êtes-vous sûr de vouloir supprimer  ?
        </p>
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
        <button
          type="button"
          class="btn w-sm btn-light"
          data-bs-dismiss="modal"
          (click)="modal.close('Close click')"
        >
          Fermer
        </button>
        <button type="button" class="btn w-sm btn-danger" id="delete-product" (click)="ConfirmDelete()" (click)="modal.close('Close click')">
          Oui, Supprimer!
        </button>
      </div>
    </div>
  </div>
  <!-- /.modal-content -->
</ng-template>
