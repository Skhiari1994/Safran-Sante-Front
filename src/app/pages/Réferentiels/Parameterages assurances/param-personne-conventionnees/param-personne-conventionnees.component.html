<div class="row" style="margin-top: 25px"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px">
  <app-breadcrumbs title="Prise en charge des personnes physiques conventionnées" [breadcrumbItems]="breadCrumbItems">
  </app-breadcrumbs>
</div>

<form [formGroup]="formRefEtablis" autocomplete="off">

  <!-- Identification et convention -->
  <div class="col-xl-12">
    <div class="card mt-4">

      <div class="card-header border-bottom-dashed d-flex align-items-center gap-3">
        <div class="avatar-sm flex-shrink-0">
          <span class="avatar-title rounded bg-primary-subtle text-primary fs-4">
            <i class="ri-user-heart-line" aria-hidden="true"></i>
          </span>
        </div>
        <div>
          <h5 class="card-title mb-0">Personne physique conventionnée</h5>
          <p class="text-muted fs-13 mb-0">Identification, activité et convention avec la CNAM.</p>
        </div>
      </div>

      <div class="card-body">
        <div class="row g-3">

          <div class="col-12">
            <h6 class="text-muted text-uppercase fs-12 fw-semibold border-bottom pb-2 mb-0">Identification</h6>
          </div>
          <div class="col-md-3 col-xl-2">
            <label for="pers-prf" class="form-label">Code</label>
            <input id="pers-prf" type="text" class="form-control" placeholder="Ex. 1234" formControlName="prf_cod" />
          </div>
          <div class="col-md-5 col-xl-5">
            <label for="pers-nom" class="form-label">Nom</label>
            <input id="pers-nom" type="text" class="form-control" placeholder="Nom" formControlName="etab_rsoc" />
          </div>
          <div class="col-md-4 col-xl-5">
            <label for="pers-prenom" class="form-label">Prénom</label>
            <input id="pers-prenom" type="text" class="form-control" placeholder="Prénom" formControlName="pr_rsoc" />
          </div>

          <div class="col-12 mt-4">
            <h6 class="text-muted text-uppercase fs-12 fw-semibold border-bottom pb-2 mb-0">Activité et convention</h6>
          </div>
          <div class="col-md-3 col-xl-2">
            <label class="form-label">Activité</label>
            <app-lov [listData]="ListeActiviteEtabliss" [columns]="columnActiviteEtabliss" codeField="cod_activ"
              [selectedCode]="codeActivite" (selectedValue)="onSelectedValueActivite($event)">
            </app-lov>
          </div>
          <div class="col-md-9 col-xl-4">
            <label for="pers-activ-lib" class="form-label">Libellé activité</label>
            <input id="pers-activ-lib" type="text" class="form-control" placeholder="Libellé de l'activité"
              [value]="libActiv" readonly />
          </div>
          <div class="col-md-4 col-xl-2">
            <label for="pers-ref-conv" class="form-label">Réf. convention</label>
            <input id="pers-ref-conv" type="text" class="form-control" placeholder="Référence"
              formControlName="ref_conv_etat" />
          </div>
          <div class="col-md-4 col-xl-2">
            <label for="pers-dat-conv" class="form-label">Date convention</label>
            <input id="pers-dat-conv" type="text" class="form-control" placeholder="jj/mm/aaaa"
              formControlName="dat_conv_etab" mask="00/00/0000" (input)="formatDate2($event)" #prtDatAcc />
          </div>
          <div class="col-md-4 col-xl-2">
            <label for="pers-etat" class="form-label">État CNAM</label>
            <select id="pers-etat" class="form-select" formControlName="etat_act_cnam">
              <option value="">Sélectionner</option>
              <option value="A">Actif</option>
              <option value="B">Bloqué</option>
            </select>
          </div>

          <div class="col-12 mt-4">
            <h6 class="text-muted text-uppercase fs-12 fw-semibold border-bottom pb-2 mb-0">Contact et coordonnées bancaires</h6>
          </div>
          <div class="col-md-6 col-xl-3">
            <label for="pers-tel" class="form-label">Téléphone</label>
            <input id="pers-tel" type="text" class="form-control" placeholder="Ex. 71 000 000" formControlName="tel_etablis" />
          </div>
          <div class="col-md-6 col-xl-3">
            <label for="pers-fax" class="form-label">Fax</label>
            <input id="pers-fax" type="text" class="form-control" placeholder="Ex. 71 000 000" formControlName="fax_etablis" />
          </div>
          <div class="col-md-6 col-xl-3">
            <label for="pers-email" class="form-label">E-mail</label>
            <input id="pers-email" type="text" class="form-control" placeholder="nom@exemple.com"
              formControlName="email_etablis" />
          </div>
          <div class="col-md-6 col-xl-3">
            <label for="pers-rib" class="form-label">RIB</label>
            <input id="pers-rib" type="text" class="form-control" placeholder="RIB" formControlName="rib_etab" />
          </div>
          <div class="col-md-6">
            <label for="pers-met" class="form-label">Mode de règlement</label>
            <input id="pers-met" type="text" class="form-control" placeholder="Mode de règlement" formControlName="met_etab" />
          </div>
          <div class="col-md-6">
            <label for="pers-compte" class="form-label">Compte</label>
            <input id="pers-compte" type="text" class="form-control" placeholder="Compte" formControlName="comp_etab" />
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Adresse -->
  <div class="col-xl-12">
    <div class="card mt-4 mb-4">

      <div class="card-header border-bottom-dashed d-flex align-items-center gap-3">
        <div class="avatar-sm flex-shrink-0">
          <span class="avatar-title rounded bg-primary-subtle text-primary fs-4">
            <i class="ri-map-pin-2-line" aria-hidden="true"></i>
          </span>
        </div>
        <div>
          <h5 class="card-title mb-0">Adresse</h5>
          <p class="text-muted fs-13 mb-0">Localisation de la personne conventionnée.</p>
        </div>
      </div>

      <div class="card-body">
        <div class="row g-3">

          <div class="col-md-3 col-xl-2">
            <label class="form-label">Gouvernorat</label>
            <app-lov [listData]="ListeGouv" [columns]="columnGouv" codeField="cod_gouv" [selectedCode]="codeGouv"
              (selectedValue)="onSelectedValueGouv($event)">
            </app-lov>
          </div>
          <div class="col-md-9 col-xl-4">
            <label for="pers-gouv-lib" class="form-label">Libellé gouvernorat</label>
            <input id="pers-gouv-lib" type="text" class="form-control" placeholder="Libellé" [value]="libGouv" readonly />
          </div>

          <div class="col-md-3 col-xl-2">
            <label class="form-label">Poste</label>
            <app-lov [listData]="ListePoste" [columns]="columnPoste" codeField="cod_poste" [selectedCode]="codePoste"
              (selectedValue)="onSelectedValuePoste($event)">
            </app-lov>
          </div>
          <div class="col-md-9 col-xl-4">
            <label for="pers-poste-lib" class="form-label">Libellé poste</label>
            <input id="pers-poste-lib" type="text" class="form-control" placeholder="Libellé" [value]="libPoste" readonly />
          </div>

          <div class="col-xl-6">
            <label for="adr_etablis" class="form-label">Adresse</label>
            <input id="adr_etablis" type="text" class="form-control" placeholder="Rue, numéro, ville"
              formControlName="adr_etablis" />
          </div>
          <div class="col-xl-6">
            <label for="adr_etablis_a" class="form-label">Adresse en arabe</label>
            <input id="adr_etablis_a" type="text" class="form-control" placeholder="العنوان" dir="rtl" lang="ar"
              formControlName="adr_etablis_a" />
          </div>

        </div>
      </div>
    </div>
  </div>

</form>

<div *ngIf="isSearch">
  <app-search-lov [listData]="listRefEtablis" [columns]="columnsSearch" (selectedValue)="search($event)">
  </app-search-lov>
</div>
