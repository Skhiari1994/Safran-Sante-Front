<div class="row" style="margin-top: 25px"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px">
<app-breadcrumbs
title="Personnes physiques conventionnées"
[breadcrumbItems]="breadCrumbItems"
></app-breadcrumbs>
<div class="col-md-12">
  <div class="card p-4 border shadow-none mb-0 mt-4">
    <div class="card-header page-card-header">
      <div class="page-card-title">
        <h5>Identification de la personne physique</h5>
        <small>Informations générales et conventionnement</small>
      </div>
    </div>
    <form [formGroup]="formRefEtablis">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">Code</label>
          <input type="text" class="form-control border-primary" placeholder="Code" formControlName="prf_cod" readonly />
        </div>
        <div class="col-md-5">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control border-primary" placeholder="Nom" formControlName="etab_rsoc" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-5">
          <label class="form-label">Prénom</label>
          <input type="text" class="form-control border-primary" placeholder="Prénom" formControlName="pr_rsoc" readonly />
        </div>
        <div class="col-md-2">
          <label class="form-label">Code activité</label>
          <input type="text" class="form-control border-primary" placeholder="Code activité" formControlName="cod_activ" readonly />
        </div>
        <div class="col-md-6">
          <label class="form-label">Libellé activité</label>
          <input type="text" class="form-control border-primary" placeholder="Libellé" [value]="libActiv" readonly />
        </div>
        <div class="col-md-2">
          <label class="form-label">Réf. convention</label>
          <input type="text" class="form-control border-primary" placeholder="Réf. convention" formControlName="ref_conv_etat" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Date convention</label>
          <input type="text" class="form-control border-primary" placeholder="jj/mm/aaaa" formControlName="dat_conv_etab" mask="00/00/0000" #prtDatAcc [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Téléphone</label>
          <input type="text" class="form-control border-primary" placeholder="Téléphone" formControlName="tel_etablis" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Fax</label>
          <input type="text" class="form-control border-primary" placeholder="Fax" formControlName="fax_etablis" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="text" class="form-control border-primary" placeholder="Email" formControlName="email_etablis" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-6">
          <label class="form-label">RIB</label>
          <input type="text" class="form-control border-primary" placeholder="RIB" formControlName="rib_etab" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Méthode</label>
          <input type="text" class="form-control border-primary" placeholder="Méthode" formControlName="met_etab" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Compte</label>
          <input type="text" class="form-control border-primary" placeholder="Compte" formControlName="comp_etab" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Etat CNAM</label>
          <select class="form-select border-primary" formControlName="etat_act_cnam" [attr.disabled]="canModify ? '' : null">
            <option value="">Sélectionner</option>
            <option value="A">ACTIF</option>
            <option value="B">BLOQUE</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Conventionnement</label>
          <select class="form-select border-primary" formControlName="conv_etab" [attr.disabled]="canModify ? '' : null">
            <option value="">Sélectionner</option>
            <option value="O">CONVENTIONNÉ</option>
            <option value="N">NON CONVENTIONNÉ</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Etat établissement</label>
          <select class="form-select border-primary" formControlName="etat_act_mut" [attr.disabled]="canModify ? '' : null">
            <option value="">Sélectionner</option>
            <option value="A">ACTIF</option>
            <option value="B">BLOQUE</option>
          </select>
        </div>
      </div>
    </form>
  </div>

  <div class="card p-4 border shadow-none mb-0 mt-4">
    <div class="card-header page-card-header">
      <div class="page-card-title">
        <h5>Adresse</h5>
        <small>Localisation de la personne</small>
      </div>
    </div>
    <form [formGroup]="formRefEtablis">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">Code gouvernorat</label>
          <input type="text" class="form-control border-primary" placeholder="Code" formControlName="cod_gouv" readonly />
        </div>
        <div class="col-md-4">
          <label class="form-label">Gouvernorat</label>
          <input type="text" class="form-control border-primary" placeholder="Libellé" [value]="libGouv" readonly />
        </div>
        <div class="col-md-2">
          <label class="form-label">Code poste</label>
          <input type="text" class="form-control border-primary" placeholder="Code" formControlName="cod_post" readonly />
        </div>
        <div class="col-md-4">
          <label class="form-label">Poste</label>
          <input type="text" class="form-control border-primary" placeholder="Libellé" [value]="libPoste" readonly />
        </div>
        <div class="col-md-6">
          <label class="form-label">Adresse</label>
          <input type="text" class="form-control border-primary" placeholder="Adresse" formControlName="adr_etablis" [attr.readonly]="canModify ? '' : null" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Adresse (arabe)</label>
          <input type="text" class="form-control border-primary" placeholder="Adresse en arabe" formControlName="adr_etablis_a" [attr.readonly]="canModify ? '' : null" />
        </div>
      </div>
    </form>
  </div>

  <div *ngIf="isSearch">
    <app-search-lov [listData]="listRefEtablis" [columns]="columnsSearch"
      (selectedValue)="search($event)"></app-search-lov>
  </div>
</div>
</div>
