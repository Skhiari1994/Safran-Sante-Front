<div class="row" style="margin-top: 25px"> 
  <app-breadcrumbs
  title="Prise en charge des motifs de suspension"
  [breadcrumbItems]="breadCrumbItems"
></app-breadcrumbs>
<div class="card">
    <div class="card-body">
      <div class="table-responsive table-card">
        <div class="card-header   text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Liste des Motifs</h5>
            <button
              class="btn btn-light"
              data-bs-toggle="modal"
              data-bs-target="#showModal"
              (click)="openModalTab(content)"
            >
              <i class="ri-add-fill me-1"></i> Ajouter Motif
            </button>
          </div>
        <p-table [value]="listMotif" [paginator]="true" [rows]="15" styleClass="p-datatable-sm p-datatable-gridlines p-datatable-striped modern-table">
            <ng-template pTemplate="header">
              <tr class="table-primary">
                <th *ngFor="let column of ['cod_mot_susp','lib_mot_susp']">
                  <div class="d-flex align-items-center">
                    <span class="me-2" (click)="onSort(column)">{{ columnTitles[column] || column }}<i class="ri-arrow-up-down-line ms-1"></i></span>
                  </div>
                </th>
                <th class="text-center">Action</th>
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-rowData let-rowIndex="rowIndex">
              <tr>
                <td>{{ rowData.cod_mot_susp }}</td>
                <td>{{ rowData.lib_mot_susp }}</td>
                <td>
                  <ul class="list-inline hstack gap-2 mb-0">
                    <li class="list-inline-item">
                      <a class="edit-item-btn" data-bs-toggle="modal" (click)="editDataGetConv(rowIndex, rowData, content)"><i class="ri-pencil-fill align-bottom text-muted"></i></a>
                    </li>
                    <li class="list-inline-item me-0" ngbTooltip="Delete" placement="top">
                      <a class="remove-item-btn" data-bs-toggle="modal" (click)="confirm(deleteModel, rowData)"><i class="ri-delete-bin-fill align-bottom text-muted"></i></a>
                    </li>
                  </ul>
                </td>
              </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              <tr>
                <td>
                  <span class="badge bg-danger-subtle text-danger badge-border">Aucune donnée disponible !</span>
                </td>
              </tr>
            </ng-template>
          </p-table>
      </div>
    
     
      <div *ngIf="listMotif.length > 0" class="d-flex justify-content-between mt-3">
        <span>{{ listMotif.length }} ligne(s) trouvée(s) sur {{ getTotalPages() }} page(s)</span>
      
         
    
    </div>
    
  </div>
</div>



<ng-template #content role="document" let-modal>
    <div class="modal-header bg-info-subtle p-3">
      <h5 class="modal-title" id="exampleModalLabel">Ajouter Motif</h5>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
        id="close-modal"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>
    <form [formGroup]="formMotif" class="tablelist-form" autocomplete="off">
       
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-lg-2">
                <div>
                  <label for="industry_type-field" class="form-label"
                    >Code motif</label
                  >
                  <input
                    type="text"
                    class="form-control border-warning"
                     placeholder="Enter code conv"
                    formControlName="cod_mot_susp"
                  />
                </div>
              </div>

              <div class="col-lg-6">
                <div>
                  <label for="industry_type-field" class="form-label"
                    >Libelle</label
                  >
                  <input
                    type="text"
                    class="form-control border-warning"
                     placeholder="Enter Libelle"
                    formControlName="lib_mot_susp"
                  />
                </div>
              </div>
 
 
 
            </div>
          </div>
      
      <div class="modal-footer">
        <div class="hstack gap-2 justify-content-end">
          <button
            type="button"
            class="btn btn-success"
            data-bs-dismiss="modal"
            (click)="saveMotifSup(); modal.close('Close click')"
          >
            Valider
          </button>
        </div>
        <br>
        <div class="hstack gap-2 justify-content-end">
          <button
            type="button"
            class="btn btn-light"
            data-bs-dismiss="modal"
            (click)="modal.close('Close click')"
          >
            Close
          </button>
        </div>
      </div>
    </form>
  </ng-template>


  <ng-template #deleteModel let-modal>
    <div class="modal-content">
      <div class="modal-header">
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
          id="btn-close"
          (click)="modal.dismiss('Cross click')"
        ></button>
      </div>
      <div class="modal-body">
        <div class="mt-2 text-center">
          <lord-icon
            src="https://cdn.lordicon.com/gsqxdxog.json"
            trigger="loop"
            colors="primary:#f7b84b,secondary:#f06548"
            style="width: 100px; height: 100px"
          ></lord-icon>
          <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
            <h4>Etes vous sûr ?</h4>
            <p class="text-muted mx-4 mb-0">
              Voulez vous supprimer le motif ?
            </p>
          </div>
        </div>
        <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
          <button
            type="button"
            class="btn w-sm btn-light"
            data-bs-dismiss="modal"
            (click)="modal.close('Close click')"
          >
          Fermer
          </button>
          <button type="button" class="btn w-sm btn-danger" id="delete-product" (click)="ConfirmDelete()" (click)="modal.close('Close click')">
            Oui, Supprimer!
          </button>
        </div>
      </div>
    </div>
    <!-- /.modal-content -->
  </ng-template>
