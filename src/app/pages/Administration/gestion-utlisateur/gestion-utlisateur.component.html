<div class="row" style="margin-top: 25px"></div>

<div class="row justify-content-center">
  <div class="col-xxl-10">
    <div class="card">
      <div class="card-body">
        <form (ngSubmit)="AddUser()" [formGroup]="utilisateurForm" autocomplete="off" class="p-2">

          <div class="card-header page-card-header d-flex justify-content-between align-items-center mb-3">
            <div class="page-card-title">
              <h5>Nouvel utilisateur</h5>
              <small>Choisir un membre du personnel, puis lui attribuer un rôle et un mot de passe</small>
            </div>
          </div>

          <!-- Personnel -->
          <h6 class="text-muted text-uppercase fs-12 mb-3">Personnel</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label">Personnel</label>
              <app-lov [listData]="listValues" [columns]="columns" codeField="mat_pers" [selectedCode]="selectedCode"
                (selectedValue)="onSelectedValue($event)">
              </app-lov>
            </div>
            <div class="col-md-2">
              <label class="form-label">Matricule (login)</label>
              <input type="text" class="form-control border-primary" placeholder="Matricule" formControlName="useLogin"
                readonly />
            </div>
            <div class="col-md-3">
              <label for="firstname" class="form-label">Nom</label>
              <input type="text" id="firstname" class="form-control border-primary" placeholder="Nom"
                formControlName="firstname" [ngClass]="{ 'is-invalid': submitted && form['firstname'].errors }" />
              <div class="invalid-feedback">Entrer le nom</div>
            </div>
            <div class="col-md-3">
              <label for="lastname" class="form-label">Prénom</label>
              <input type="text" id="lastname" class="form-control border-primary" placeholder="Prénom"
                formControlName="lastname" [ngClass]="{ 'is-invalid': submitted && form['lastname'].errors }" />
              <div class="invalid-feedback">Entrer le prénom</div>
            </div>
          </div>

          <!-- Compte -->
          <h6 class="text-muted text-uppercase fs-12 mb-3">Compte</h6>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control border-primary" placeholder="nom@exemple.com"
                formControlName="email" [ngClass]="{ 'is-invalid': submitted && form['email'].errors }" />
              <div class="invalid-feedback">Entrer un email valide</div>
            </div>
            <div class="col-md-4">
              <label for="roles" class="form-label">Rôle</label>
              <select id="roles" class="form-select border-primary" formControlName="roles"
                [ngClass]="{ 'is-invalid': submitted && form['roles'].errors }">
                <option value="">Sélectionner</option>
                <option *ngFor="let i of listRole" [value]="i.name">{{ i.name }}</option>
              </select>
              <div class="invalid-feedback">Choisir un rôle</div>
            </div>
            <div class="col-md-4"></div>

            <div class="col-md-4">
              <label for="password" class="form-label">Mot de passe</label>
              <div class="input-group">
                <input [type]="showPassword ? 'text' : 'password'" id="password" class="form-control border-primary"
                  placeholder="Mot de passe" formControlName="password"
                  [ngClass]="{ 'is-invalid': submitted && form['password'].errors }" />
                <button type="button" class="btn btn-light border" (click)="showPassword = !showPassword"
                  title="Afficher / masquer">
                  <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                </button>
              </div>
              <div class="text-danger fs-12 mt-1" *ngIf="submitted && form['password'].errors">Entrer le mot de passe</div>
            </div>
            <div class="col-md-4">
              <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
              <div class="input-group">
                <input [type]="showPassword ? 'text' : 'password'" id="confirmPassword"
                  class="form-control border-primary" placeholder="Confirmer le mot de passe"
                  formControlName="confirmPassword"
                  [ngClass]="{ 'is-invalid': (submitted || form['confirmPassword'].dirty) && utilisateurForm.errors?.['mismatch'] }" />
              </div>
              <div class="text-danger fs-12 mt-1"
                *ngIf="(submitted || form['confirmPassword'].dirty) && utilisateurForm.errors?.['mismatch']">
                Les mots de passe ne correspondent pas
              </div>
            </div>
          </div>

          <div class="hstack gap-2 justify-content-end mt-4 flex-wrap">
            <button type="button" class="btn btn-light" (click)="resetForm()">Réinitialiser</button>
            <button type="submit" class="btn btn-success">
              <i class="ri-save-line align-bottom me-1"></i> Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
