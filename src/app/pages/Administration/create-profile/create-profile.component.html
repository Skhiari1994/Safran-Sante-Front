<div class="container-fluid">
    <li class="list-inline-item px-2" style="float: inline-end;">
        <a href="javascript: void(0);"
            ngbTooltip="Mettre à jour pers valideur"
            (click)="openModalRole(content)">  <button type="submit" class="btn btn-success" id="btn-save-event"  
            style="float: right;">
            {{"Ajouter un rôle" |translate}}
        </button></a>
    </li>
    <ng-template #content role="document" let-modal>
        <div class="modal-header">
            <h5 class="modal-title mt-0"><b>{{"Ajouter un profile" |translate}}</b></h5>
            <button type="button" class="btn-close" aria-hidden="true"
                (click)="modal.dismiss('Cross click')"></button>
        </div>
        <div class="modal-body">
            <form [formGroup]="RoleForm">
                <div class="row">
                    <div class="col-sm-12">
                        <div class="mb-4 row">
                            <label class="col-md-4 col-form-label">Nom de profil</label>
                            <div class="col-md-6">
                                <input id="input" class="form-control" type="text" size="20"
                                    title="Nom de profile" formControlName="name">
                            </div>
                        </div>
 
                    </div>
                </div>
                <button type="submit" class="btn btn-success" id="btn-save-event" (click)="AddRole()"
                    style="float: right;">
                    {{"Enregistrer" |translate}}
                </button>
            </form>
        </div>
    </ng-template>
     
    
        <ng-template #content2 role="document" let-modal>
            <div class="modal-header">
                <h5 class="modal-title mt-0"><b>{{"Changement d\'un profile" |translate}}</b></h5>
                <button type="button" class="btn-close" aria-hidden="true"
                    (click)="modal.dismiss('Cross click')"></button>
            </div>
            <div class="modal-body">
                <form [formGroup]="RoleForm">
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="mb-4 row">
                                <label class="col-md-4 col-form-label">Nom de profil</label>
                                <div class="col-md-6">
                                    <input id="input" class="form-control" type="text" size="20"
                                        title="Nom de profile" formControleName="name">
                                </div>
                            </div>

                        </div>
                    </div>
                    <button type="submit" class="btn btn-success" id="btn-save-event" (click)="AddRole()"
                        style="float: right;">
                        {{"Enregistrer" |translate}}
                    </button>
                </form>
            </div>
        </ng-template>

        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table align-middle table-nowrap table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" style="width: 70px">#</th>
                                        <th scope="col">{{"Profile" |translate}}</th>
                                        <th scope="col">{{"Commentaire" |translate}}</th>
                                        <th scope="col">{{"Actions" |translate}}</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="
                        let item of ListRole
                          
                          | paginate : { itemsPerPage: 10, currentPage: p };
                        let i = index
                      ">
                                        <td>
                                            <div class="avatar-xs">
                                                <span class="avatar-title rounded-circle"> User </span>
                                            </div>
                                        </td>
                                        <td>
                                            <a href="javascript: void(0);" class="text-dark">{{ item.name }} </a>
                                        </td>
                                        <td>
                                            <div>
                                                <a href="javascript: void(0);" class="text-dark">{{ item.created_date }}</a>
                                            </div>
                                        </td>
                                         <td style="display: flex;">
                                            <ul class="list-inline font-size-20 contact-links mb-0">

                                                <li class="list-inline-item px-2">
                                                    <a href="javascript: void(0);"
                                                        ngbTooltip="Mettre à jour pers valideur"
                                                        (click)="openModal(content2, item)"><i
                                                            class="bx bx-pencil"></i></a>
                                                </li>
                                            </ul>

                                        
                                            <ul class="list-inline font-size-20 contact-links mb-0">

                                                <li class="list-inline-item px-2">
                                                    <a href="javascript: void(0);"
                                                       
                                                        (click)="DeleteRole(item.id)"><i
                                                            class="bx bx-trash-alt"></i></a>
                                                </li>
                                            </ul>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <div class="text-center my-3">
                                    <pagination-controls (pageChange)="p = $event"></pagination-controls>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
 
</div>
