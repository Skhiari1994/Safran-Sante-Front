<app-toasts aria-live="polite" aria-atomic="true"></app-toasts>

<div class="home">
  <!-- Bienvenue -->
  <section class="home-welcome" aria-labelledby="home-titre">
    <div class="home-welcome-text">
      <p class="home-date">{{ dateDuJour }}</p>
      <h1 class="home-title" id="home-titre">{{ salutation }}<ng-container *ngIf="nomComplet">, {{ nomComplet }}</ng-container></h1>
      <p class="home-sub">Bienvenue sur votre espace mutuelle. Utilisez le menu à gauche pour accéder à vos écrans.</p>
      <div class="home-chips">
        <span class="home-chip" *ngIf="libSociete"><i class="ri-building-2-line" aria-hidden="true"></i>{{ libSociete }}</span>
        <span class="home-chip home-role" *ngIf="roleLibelle" [ngClass]="'role-' + roleCle"><i class="ri-shield-user-line" aria-hidden="true"></i>{{ roleLibelle }}</span>
      </div>
    </div>
    <img class="home-welcome-logo d-none d-md-block" src="assets/images/safran-logo.png" alt="" aria-hidden="true">
  </section>
</div>
