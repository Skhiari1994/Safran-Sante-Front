<div class="col-md-12 d-flex justify-content-center">
    <div style="width: 90%;"> <!-- Largeur du conteneur -->
        <div class="collapse show" id="paymentmethodCollapse">
            <div class="card p-4 border shadow-none mb-0 mt-4">
                <form action="javascript:void(0);" class="row g-3" [formGroup]="formRetenue">
                    <div class="row">
                        <div class="col-md-12">
                            <!-- Filters -->
                            <div class="row">
                                <div class="row mt-3">
                                    <!-- Date Field -->
                                    <div class="col-md-3">
                                        <label class="form-label">Date (mm/yyyy)</label>
                                        <input type="text" class="form-control border-success"
                                            formControlName="dat_retenue" mask="00/0000" placeholder="mm/yyyy" />
                                    </div>

                                    <!-- Type Personnel Dropdown -->
                                    <div class="col-md-4">
                                        <label class="form-label">Type Personnel</label>
                                        <select class="form-select border-success" formControlName="typ_pers">
                                            <option value=""></option>
                                            <option *ngFor="let i of listTypePers" [value]="i.cod_typ">
                                                {{ i.lib_typ }}
                                            </option>
                                        </select>
                                    </div>

                                    <!-- Format Dropdown -->
                                    <div class="col-md-3">
                                        <label class="form-label">Format</label>
                                        <select class="form-select border-success" formControlName="format">
                                            <option value="PDF">PDF</option>
                                            <option value="Excel">Excel</option>
                                        </select>
                                    </div>

                                    <!-- Buttons -->
                                    <div class="col-md-12 d-flex justify-content-center align-items-end mt-3">
                                        <button class="btn btn-primary me-2" (click)="printEditionGlobal()">
                                            Edition Global
                                        </button>
                                        <button class="btn btn-secondary me-2" (click)="editionMvtDuMois()">
                                            Edition Mvt du Mois
                                        </button>
                                        <button class="btn btn-info" (click)="editionNonPreparer()">
                                            Edition Non Préparer du Mois
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <!-- Master Table: Personnel List -->
                <div class="row mt-4">
                    <div class="col-md-12">
                        <h5>Liste du Personnel</h5>
                        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                            <table class="table table-bordered table-striped table-hover">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th *ngFor="let col of columnsRetenueMens">{{ col.label }}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let row of listRetenueMens" (click)="onRowSelect(row)"
                                        style="cursor: pointer;"
                                        [class.table-active]="row.mat_pers === selectedMatPers">
                                        <td>{{ row.mat_pers }}</td>
                                        <td>{{ row.nom }}</td>
                                        <td>{{ row.abrv_fixe }}</td>
                                        <td>{{ row.mnt_retenue }}</td>
                                        <td>{{ row.valid }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Detail Table: Loan Details -->
                <div class="row mt-4">
                    <div class="col-md-12">
                        <h5>Détails des Prêts</h5>
                        <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
                            <table class="table table-bordered table-striped">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th *ngFor="let col of columnsDetRetenue">{{ col.label }}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let row of listDetRetenue">
                                        <td>{{ row.cod_pret }}</td>
                                        <td>{{ row.l_pret }}</td>
                                        <td>{{ row.cod_grp_pret }}</td>
                                        <td>{{ row.typ_pret }}</td>
                                        <td>{{ row.lib_pret }}</td>
                                        <td>{{ row.mnt_period }}</td>
                                        <td>{{ row.mnt_int }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div *ngIf="isSearch">
    <app-search-lov [listData]="personnelList" [columns]="columnsSearch" (selectedValue)="search($event)">
    </app-search-lov>
</div>
