<div class="col-md-12 d-flex justify-content-center">
    <div style="width: 70%;"> <!-- Largeur du conteneur -->
        <div class="collapse show" id="paymentmethodCollapse">
            <div class="card p-4 border shadow-none mb-0 mt-4">
                <form action="javascript:void(0);" class="row g-3" [formGroup]="formAdherent">
                    <div class="row">
                        <div class="col-md-12">
                            <!-- Bloc 1 -->
                            <div class="row">
                                <div class="row mt-3">
                                    <!-- Champ Mois -->
                                    <div class="col-md-2">
                                        <label class="form-label">Date début</label>
                                        <input type="text" class="form-control" formControlName="datDeb"
                                            mask="00/00/0000" placeholder="dd/mm/yyyy" />
                                    </div>

                                </div>



                                <div class="row mt-3">
                                    <div class="col-md-2">
                                        <label class="form-label">Groupe prêt</label>
                                        <app-lov [listData]="typPretList" [columns]="columnstypPret"
                                            codeField="cod_grp_pret"
                                            [selectedCode]="formAdherent.get('grp_pret')?.value"
                                            (selectedValue)="onSelectedTyp($event)"></app-lov>
                                    </div>
                                    <div class="col-md-1">
                                        <label class="form-label">Type</label>
                                        <input type="text" class="form-control" formControlName="typ_pret" />
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label">Libelle</label>
                                        <input type="text" class="form-control" formControlName="libPret" readonly />
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Format</label>
                                        <select class="form-select" formControlName="format">
                                            <option value="PDF">PDF</option>
                                            <option value="Excel">Excel</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
