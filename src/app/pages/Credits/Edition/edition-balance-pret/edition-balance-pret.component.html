<div class="col-md-12 d-flex justify-content-center">
  <div style="width: 70%;"> <!-- Largeur du conteneur -->
    <div class="collapse show" id="paymentmethodCollapse">
      <div class="card p-4 border shadow-none mb-0 mt-4">
        <form action="javascript:void(0);" class="row g-3" [formGroup]="formAdherent">
          <div class="row">
            <div class="col-md-12">
              <!-- Bloc 1 -->
              <div class="row">
                <div class="row mt-3">
                  <!-- Champ Mois -->
                  <div class="col-md-2">
                    <label class="form-label">Date début</label>
                    <input type="text" class="form-control" formControlName="datDeb" mask="00/0000" />
                  </div>
                  <div class="col-md-3"></div>
                  <!-- Champ Année -->
                  <div class="col-md-2">
                    <label class="form-label">Date fin</label>
                    <input type="text" class="form-control" formControlName="datFin" mask="00/0000" />
                  </div>
                </div>

                <div class="col-md-2">
                  <label class="form-label">Matricule début</label>
                  <app-lov [listData]="personnelList" [columns]="columnsSearch" codeField="mat_pers"
                    [selectedCode]="formAdherent.get('mat_pers')?.value"
                    (selectedValue)="onSelectedVMat($event)"></app-lov>
                </div>

                <div class="col-md-5">
                  <label class="form-label">Nom</label>
                  <input type="text" class="form-control" formControlName="nom_deb" readonly />
                </div>
              </div>

              <div class="row mt-3">
                <!-- Champ Etat -->
                <div class="col-md-2">
                  <label class="form-label">Etat</label>
                  <select class="form-select border-success" formControlName="etat">
                    <option value="">Tous</option>
                    <option value="V">Validé</option>
                    <option value="S">Instance</option>
                    <option value="D">Débloqué</option>
                  </select>
                </div>

                <div class="col-md-3"></div>

                <!-- Champ Mode de payement -->
                <div class="col-md-2">
                  <label class="form-label">Mode de payement</label>
                  <select class="form-select border-success" formControlName="typ_reg">
                    <option value="">Tous</option>
                    <option value="E">Espèce</option>
                    <option value="S">Salaire</option>
                    <option value="C">Chèque</option>
                    <option value="P">Virement</option>
                    <option value="B">Bon d'achat</option>
                  </select>
                </div>
              </div>

              <!-- Bloc 2 -->
              <div class="row mt-3">
                <div class="col-md-2">
                  <label class="form-label">Matricule fin</label>
                  <app-lov [listData]="personnelList" [columns]="columnsSearch" codeField="mat_pers"
                    [selectedCode]="formAdherent.get('mat_pers2')?.value"
                    (selectedValue)="onSelectedVMat2($event)"></app-lov>
                </div>

                <div class="col-md-5">
                  <label class="form-label">Nom</label>
                  <input type="text" class="form-control" formControlName="nom_fin" readonly />
                </div>
              </div>

              <div class="row mt-3">
                <div class="col-md-2">
                  <label class="form-label">Groupe prêt</label>
                  <app-lov [listData]="groupPretList" [columns]="columnsGroupPret" codeField="cod_grp_pret"
                    [selectedCode]="formAdherent.get('cod_pret')?.value"
                    (selectedValue)="onSelectedGrpPret($event)"></app-lov>
                </div>

                <div class="col-md-5">
                  <label class="form-label">Libelle</label>
                  <input type="text" class="form-control" formControlName="libPret" readonly />
                </div>
              </div>

              <div class="col-md-3">
                <label class="form-label">Corps</label>
                <select class="form-select border-success" formControlName="corps">
                  <option value=""></option>
                  <option *ngFor="let i of listCorps" [value]="i.cod_corps">
                    {{ i.lib_corps }}
                  </option>
                </select>
                <div class="col-md-3">
                  <label class="form-label">Format</label>
                  <select class="form-select" formControlName="format">
                    <option value="PDF">PDF</option>
                    <option value="Excel">Excel</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
