<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
    <app-breadcrumbs title="Saisie montant d'anticipation"
        [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
</div>
<div class="d-flex justify-content-center mt-4">
    <div class="col-md-10">
        <div class="collapse show" id="paymentmethodCollapse">
            <div class="card p-4 border shadow-none">
                <!-- Search Form -->
                <form action="javascript:void(0);" class="row g-3" [formGroup]="FormVirAnticip">
                    <div class="row">
                        <!-- First Column -->
                        <div class="col-md-12">
                            <div class="row">
                                <div class="col-md-2">
                                    <label class="form-label">Matricule</label>
                                    <!-- <app-matricule-lov  
                                        [listData]="listPersonnel"
                                        [columns]="columnPersonnels"
                                        codeField="mat_pers"
                                        [selectedCode]="matPersVal"
                                        (selectedValue)="onSelectedValuePers($event)">
                                    </app-matricule-lov> -->

                                    <app-lov
                                    [listData]="listPersonnel"
                                    [columns]="columnPersonnels"
                                    codeField="mat_pers"
                                    [selectedCode]="matPersVal"
                                    (selectedValue)="onSelectedValuePers($event)"
                                  >
                                  </app-lov>  
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Nom & Prénom</label>
                                    <input type="text" class="form-control border-primary" [value]="nomPren" readonly />
                                </div>
                                <div class="col-md-1">
                                    <label class="form-label">Numéro</label>
                                    <input type="text" class="form-control border-primary" formControlName="num_vir" readonly />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Date anticip</label>
                                    <input type="text" class="form-control border-primary" formControlName="dat_anticip" mask="00/00/0000" />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Mont virement</label>
                                    <input type="text" class="form-control border-primary montant-input" formControlName="mont_vir" appMontantMask (change)="MontRest()" />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Montant anticipation</label>
                                    <input type="text" class="form-control border-primary montant-input" formControlName="mont_antic" appMontantMask (change)="MontRest()" />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Reste virement</label>
                                    <input type="text" class="form-control border-primary montant-input" formControlName="rest_vir" appMontantMask readonly />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Dans valeur espéce</label>
                                    <input type="text" class="form-control border-primary montant-input" formControlName="mnt_esp" appMontantMask />
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Imput Cpt</label>
                                    <select class="form-select border-success" formControlName="imput_cpt">
                                        <option value="O">Imputé</option>
                                        <option value="N">Non Imputé</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Etat vir</label>
                                    <select class="form-select border-success" formControlName="etat_vir">
                                        <option value="N">En instance</option>
                                        <option value="O">Validé</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Réf métier</label>
                                    <input type="text" class="form-control border-primary" formControlName="ref_metier" />
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Observation</label>
                                    <textarea class="form-control border-primary" formControlName="obs_metier"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Section Recherche -->
<div *ngIf="isSearch" class="d-flex justify-content-center">
    <app-search-lov [listData]="listVir" [columns]="columnsVir" (selectedValue)="search($event)">
    </app-search-lov>
</div>
