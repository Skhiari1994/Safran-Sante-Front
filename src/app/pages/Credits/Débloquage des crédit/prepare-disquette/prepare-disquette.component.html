<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
    <app-breadcrumbs title="Déblocage et comptabilisation des crédits par virement"
        [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
</div>
<div class="d-flex justify-content-center   vh-100">
  <div class="col-md-10">
    <div class="collapse show" id="paymentmethodCollapse">
      <div class="card p-4 border shadow-none mb-0 mt-4">
        <form action="javascript:void(0);" class="row g-3" [formGroup]="commissionForm">
          <div class="col-md-1">
            <label for="billinginfo-phone" class="form-label">Num comm</label>
            <app-lov
            [listData]="listComm"
            [columns]="columnsComm"
            codeField="num_comm"
            [selectedCode]="commission"
            (selectedValue)="onSelectedComm($event)"
          ></app-lov>
          </div>
          <div class="col-md-2">
            <label for="billinginfo-phone" class="form-label">Réf comm</label>
            <input
              type="text"
              class="form-control border-primary"
              placeholder="Entrer ref comm"
              formControlName="ref_comm"
              readonly
            />
          </div>
          <div class="col-md-2">
            <label for="billinginfo-phone" class="form-label">Date début</label>
            <input
              type="text"
              class="form-control border-warning"
              mask="00/00/0000"
              placeholder="Entrer la date début"
              formControlName="dat_deb_comm"
              appDateFormatter
              readonly
            />
          </div>
          <div class="col-md-2">
            <label for="billinginfo-phone" class="form-label">Date fin</label>
            <input
              type="text"
              class="form-control border-warning"
              mask="00/00/0000"
              placeholder="Entrer la date fin"
              formControlName="dat_fin_comm"
              appDateFormatter
              readonly
            />
          </div>
          <div class="col-md-2">
            <label for="billinginfo-phone" class="form-label">Date commission</label>
            <input
              type="text"
              class="form-control border-warning"
              mask="00/00/0000"
              placeholder="Entrer la date comm"
              formControlName="dat_comm"
              appDateFormatter
              readonly
            />
          </div>
          <div class="col-md-3">
            <label for="country" class="form-label">Etat commission</label>
            <select class="form-select border-success" formControlName="cod_etat_pret">
              <option value=""></option>
              <option value="P">Préparer</option>
              <option value="V">Validée</option>
              <option value="C">CLOTURE</option>
            </select>
          </div>
          <div class="col-md-4"></div>
          <div class="col-md-3">
              <label for="country" class="form-label">Date déblocage</label>
              <input type="text" 
              class="form-control border-warning" 
              mask="00/00/0000"
              placeholder="Date déblocage"
              formControlName="datDebl" />
            </div>
          <hr>  
          <div class="row">
              <div class="text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"></h5>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary" (click)="generateAndDownloadFile()">
                    <i class="ri-add-fill me-1"></i> Charger
                  </button>
                  <div *ngIf="bool==true">
                  <button class="btn btn-secondary" (click)="downloadFilePret()" >
                    <i class="ri-add-fill me-1"></i> Télécharger
                  </button>
              </div>
                </div>
              </div>
            </div>
            
        </form>
      
      </div>
    </div>
  </div>
</div>
