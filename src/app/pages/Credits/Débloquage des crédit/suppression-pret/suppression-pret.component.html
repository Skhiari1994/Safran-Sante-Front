<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
    <app-breadcrumbs title="Suppression des crédits" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
</div>

<div class="col-md-12">
    <div class="card p-4 border shadow-none mb-0 mt-4">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Matricule</label>
                        <input type="text" class="form-control border-primary" [value]="matricule" readonly />
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Nom & prénom</label>
                        <input type="text" class="form-control border-primary" [value]="nomPers" readonly />
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Département</label>
                        <input type="text" class="form-control border-primary" [value]="codLieuGeog" readonly />
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Libelle</label>
                        <input type="text" class="form-control border-primary" [value]="LibLieuGeog" readonly />
                    </div>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-danger btn-lg" (click)="deleteCredit()">
                    <i class="ri-delete-bin-line me-1"></i> Supprimer le crédit
                </button>
            </div>
        </div>
    </div>
</div>

<div class="col-md-12 mt-4">
    <div class="card p-4 border shadow-none">
        <form [formGroup]="formPretPers">
            <div class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Code prêt</label>
                    <input type="text" class="form-control border-primary" formControlName="cod_pret" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Organisme</label>
                    <input type="text" class="form-control border-primary" [value]="libOrg" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Type prêt</label>
                    <input type="text" class="form-control border-primary" [value]="libPret" readonly />
                </div>
                <div class="col-md-2">
                    <label class="form-label">Montant demandé</label>
                    <input type="text" class="form-control border-primary" formControlName="prt_mnt_glb" readonly />
                </div>
                <div class="col-md-2">
                    <label class="form-label">Date accord</label>
                    <input type="text" class="form-control border-primary" formControlName="prt_dat_acc" readonly />
                </div>
                <div class="col-md-2">
                    <label class="form-label">Etat</label>
                    <input type="text" class="form-control border-primary" formControlName="cod_etat_pret" readonly />
                </div>
            </div>
        </form>
    </div>



    <div *ngIf="isSearch">
        <app-search-lov [listData]="lisPrets" [columns]="columnsPret" (selectedValue)="search($event)">
        </app-search-lov>
    </div>
