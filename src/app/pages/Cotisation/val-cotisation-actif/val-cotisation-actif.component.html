<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
  <app-breadcrumbs title="Validation des Cotisation des actifs par période"
    [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
</div>

<div class="col-xl-12">
  <div class="card p-4 border shadow-none mb-0 mt-4">
    <form action="javascript:void(0);" class="row g-3" [formGroup]="formCotisMutPersForm">

      <!-- Row 1: Matricule, Nom, Prénom -->



      <!-- Row 1: mois, corps -->
      <div class="col-md-3">
        <label for="country" class="form-label">Mois</label>
        <input type="text" class="form-control border-warning" mask="00/0000" formControlName="dat_deb"
          appDateFormatter />
      </div>

      <div class="col-md-4">
        <label for="billinginfo-date-embauche" class="form-label">Corps</label>
        <select class="form-select border-success" data-plugin="choices" formControlName="corps"
          (change)="onCorpsChange($event)">
          <option value="">Select corps...</option>
          <option *ngFor="let corps of corpsList" [value]="corps.cod_corps">
            {{ corps.lib_corps }}
          </option>
        </select>
      </div>


      <div class="col-md-3">
        <label for="billinginfo-phone" class="form-label">Matricule
        </label>
        <div>
          <input type="text" class="form-control border-warning" placeholder="Enter Matricule"
            formControlName="mat_pers" />
          <div *ngIf="errorMessageMat" class="error-message">{{ errorMessageMat }}</div>
        </div>
      </div>



      <!-- Row 4: Motif de départ, Libellé de motif de départ, Etat Actif -->
      <div class="col-md-8">
        <label for="billinginfo-phone" class="form-label">Message </label>
        <input type="text" class="form-control border-primary" disabled />
      </div>
      <div class="col-md-6">

        <button type="button" class="btn btn-primary waves-effect waves-light" (click)="ChargActInx()">Chargement Actif
          Inex</button>
      </div>
      <div class="col-md-6">

        <button type="button" class="btn btn-primary waves-effect waves-light" (click)="ValidationT()">Valider
          Tout</button>
      </div>



    </form>
  </div>
</div>

<div class="col-xl-12">
  <div class="card p-4 border shadow-none mb-0 mt-4">
    <h5 class="mb-1 text-primary mb-3">Affiliations</h5>

    <div class="card-header">
      <div class="d-flex align-items-center flex-wrap gap-9">
        <div class="flex-grow-1"></div>


      </div>
    </div>
    <div class="card-body">
      <p-table [value]="filteredDataRows" [paginator]="true" [rows]="12" styleClass="modern-table">
        <ng-template pTemplate="header">
          <tr class="table-primary">
            <th *ngFor="let column of ['mat_pers', 'num_retr', 'nom_pers', 'dat_deb','mnt_payer','mod_pay','etat_cot']"
              [pSortableColumn]="column">
              <div class="d-flex align-items-center">
                <span class="me-2" (click)="onSort(column)"> {{ columnTitles[column] || column }} </span>
                <p-sortIcon [field]="column"></p-sortIcon>
                <i class="ri-search-line text-muted ms-2" (click)="toggleFilter(column); $event.stopPropagation()"></i>
                <input *ngIf="showFilters[column]" (click)="$event.stopPropagation()" type="text"
                  class="form-control form-control-sm ms-2" style="width: 100px;" [(ngModel)]="searchz[column]"
                  (input)="applyFilter()" placeholder="..." />
              </div>
            </th>
            <th>Action</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-data let-rowIndex="rowIndex">
          <tr [ngClass]="{'bg-light': rowIndex % 2 === 0, 'bg-white': rowIndex % 2 !== 0}"
            [ngClass]="{ 'table-active': selectedRow === rowIndex }">
            <td>
              <div class="d-flex align-items-center">
                <div class="flex-grow-1 ms-2 name">{{ data.mat_pers }}</div>
              </div>
            </td>
            <td><ngb-highlight [result]="data.num_retr" [term]="searchTerm"></ngb-highlight></td>
            <td><ngb-highlight [result]="data.nom_pers" [term]="searchTerm"></ngb-highlight></td>
            <td><ngb-highlight [result]="data.dat_deb" [term]="searchTerm"></ngb-highlight></td>
            <td>
              <input type="text" class="form-control" appMontantMask [(ngModel)]="data.mnt_payer"
                (change)="getValueVirEtat(data)">
            </td>
            <td>
              <select [(ngModel)]="data.mod_pay" (change)="getValueVirEtat(data)" class="form-select">
                <option value="E">Espece</option>
                <option value="V">Virement</option>
              </select>
            </td>
            <td>
              <select [(ngModel)]="data.etat_cot" (change)="getValueVirEtat(data)" class="form-select">
                <option value="I">En Instance</option>
                <option value="V">Validé</option>
              </select>
            </td>
            <td>
              <ul class="list-inline hstack gap-2 mb-0">
                <li class="list-inline-item me-0" ngbTooltip="Delete" placement="top">
                  <a class="remove-item-btn" data-bs-toggle="modal" (click)="confirm(deleteModel, data._id)">
                    <i class="ri-delete-bin-fill align-bottom text-muted"></i>
                  </a>
                </li>
              </ul>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="8">
              <span class="badge bg-danger-subtle text-danger badge-border">Aucune donnée disponible !</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
<br>

<!-- end row -->
<div *ngIf="isSearch">
  <app-search-lov [listData]="listPersonnel" [columns]="columnsSearch" (selectedValue)="search($event)">
  </app-search-lov>
</div>

<ng-template #deleteModel let-modal>
  <div class="modal-content">
    <div class="modal-header">
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="btn-close"
        (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
      <div class="mt-2 text-center">
        <lord-icon src="https://cdn.lordicon.com/gsqxdxog.json" trigger="loop"
          colors="primary:#f7b84b,secondary:#f06548" style="width: 100px; height: 100px"></lord-icon>
        <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
          <h4>Are you sure ?</h4>
          <p class="text-muted mx-4 mb-0">
            Are you sure you want to remove this address ?
          </p>
        </div>
      </div>
      <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
        <button type="button" class="btn w-sm btn-light" data-bs-dismiss="modal" (click)="modal.close('Close click')">
          Close
        </button>
        <button type="button" class="btn w-sm btn-danger" id="delete-product">
          Yes, Delete It!
        </button>
      </div>
    </div>
  </div>
  <!-- /.modal-content -->
</ng-template>
