<div class="row" style="margin-top: 25px;"></div>
<div class="row sticky-top" style="z-index: 1025; top: 121px;">
  <app-breadcrumbs title="Journal de contrôle Mutuelle (BS saisie)"
    [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>
</div>

<div class="col-md-12 d-flex justify-content-center">

  <div style="width: 70%;"> <!-- Largeur du conteneur -->
    <div class="collapse show" id="paymentmethodCollapse">
      <div class="card p-4 border shadow-none mb-0 mt-4">
        <form action="javascript:void(0);" class="row g-3" [formGroup]="formAdherent">
          <div class="row">
            <div class="col-md-12">
              <!-- Bloc 1 -->
              <div class="row">
                <div class="row mt-3">

                  <div class="col-md-2">
                    <label class="form-label">Matricule début</label>
                    <app-lov [listData]="personnelListDeb" [columns]="columnsSearch" codeField="mat_pers"
                      [selectedCode]="formAdherent.get('mat_pers')?.value"
                      (selectedValue)="onSelectedVMat($event)"></app-lov>
                  </div>

                  <div class="col-md-5">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" formControlName="nom_deb" readonly />
                  </div>

                </div>

                <div class="col-md-2">
                  <label class="form-label">Matricule fin</label>
                  <app-lov [listData]="personnelListFin" [columns]="columnsSearch" codeField="mat_pers"
                    [selectedCode]="formAdherent.get('mat_pers')?.value"
                    (selectedValue)="onSelectedVMatFin($event)"></app-lov>
                </div>

                <div class="col-md-5">
                  <label class="form-label">Nom</label>
                  <input type="text" class="form-control" formControlName="nom_fin" readonly />
                </div>
              </div>
              <div class="row mt-3">
                <div class="col-md-3">
                  <label class="form-label">Date début</label>
                  <input type="text" class="form-control" formControlName="dat_deb" mask="00/00/0000"
                    placeholder="dd/mm/yyyy" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Date fin</label>
                  <input type="text" class="form-control" formControlName="dat_fin" mask="00/00/0000"
                    placeholder="dd/mm/yyyy" />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Choix</label>
                  <select class="form-select border-success" formControlName="choix">
                    <option value="1"> List Bs</option>
                    <option value="2"> List Bs detaillé</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
