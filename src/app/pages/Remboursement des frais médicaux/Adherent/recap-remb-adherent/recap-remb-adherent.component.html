<div class="d-flex justify-content-center mt-4">
    <div class="col-md-10">
        <div class="collapse show" id="paymentmethodCollapse">
            <div class="card p-4 border shadow-none">
                <!-- Search Form -->
                <form action="javascript:void(0);" class="row g-3" [formGroup]="formAdherent">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="row">
                                <!-- ANNEE Field -->
                                <div class="col-md-3">
                                    <label class="form-label">Année <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control border-primary" formControlName="annee"
                                        placeholder="Année" #requiredInput (blur)="onBlur()" maxlength="4"
                                        pattern="[0-9]*" />
                                </div>
                            </div>

                            <!-- Matricule Début -->
                            <div class="row mt-3">
                                <div class="col-md-2">
                                    <label class="form-label">Matricule </label>
                                    <app-lov [listData]="personnelListDeb" [columns]="columnsSearch"
                                        codeField="mat_pers" [selectedCode]="formAdherent.get('mat_pers_deb')?.value"
                                        (selectedValue)="onSelectedVMat($event)">
                                    </app-lov>
                                </div>

                                <div class="col-md-5">
                                    <label class="form-label">Nom</label>
                                    <input type="text" class="form-control border-primary" formControlName="nom_deb"
                                        readonly placeholder="Nom & Prénom" />
                                </div>
                            </div>

                            <!-- Matricule Fin -->

                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
