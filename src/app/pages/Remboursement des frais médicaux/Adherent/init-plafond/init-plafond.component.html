<div class="col-md-12 d-flex justify-content-center">

  <div style="width: 70%;"> <!-- Largeur du conteneur -->
    <div class="collapse show" id="paymentmethodCollapse">
      <div class="card p-4 border shadow-none mb-0 mt-4">
        <form action="javascript:void(0);" class="row g-3" [formGroup]="formAdherent">
          <div class="row">
            <div class="col-md-12">
              <!-- Bloc 1 -->
              <div class="row">

                <div class="col-md-3">
                  <label class="form-label">Année</label>
                  <input type="text" class="form-control" formControlName="annee" mask="0000" />
                </div>
                <div class="row mt-3">
                  <div class="col-md-2">
                    <label class="form-label">Matricule début</label>
                    <app-lov [listData]="personnelListDeb" [columns]="columnsSearch" codeField="mat_pers"
                      [selectedCode]="formAdherent.get('mat_pers')?.value"
                      (selectedValue)="onSelectedVMat($event)"></app-lov>
                  </div>

                  <div class="col-md-5">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" formControlName="nom_deb" readonly />
                  </div>

                </div>

                <div class="col-md-2">
                  <label class="form-label">Matricule fin</label>
                  <app-lov [listData]="personnelListDeb" [columns]="columnsSearch" codeField="mat_pers"
                    [selectedCode]="formAdherent.get('mat_pers')?.value"
                    (selectedValue)="onSelectedVMatFin($event)"></app-lov>
                </div>

                <div class="col-md-5">
                  <label class="form-label">Nom</label>
                  <input type="text" class="form-control" formControlName="nom_fin" readonly />
                </div>
              </div>
              <div class="row mt-3">
                <div class="col-12 d-flex justify-content-center">
                  <button class="btn btn-success btn-lg" (click)="calculePlafond()" [disabled]="formAdherent.invalid">
                    <i class="fa fa-calculator"></i> Calculer
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
