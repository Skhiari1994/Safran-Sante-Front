<div class="d-flex justify-content-center mt-4">
    <div class="col-md-10">
        <div class="card p-4 border shadow-none">
            <h5 class="card-title mb-4">Recap général des réglements de l'année</h5>
            <form action="javascript:void(0);" [formGroup]="formRecap">
                <div class="row align-items-end">
                    <!-- ANNEE Field -->
                    <div class="col-md-4">
                        <label class="form-label">Année <span class="text-danger">*</span></label>
                        <input type="text" class="form-control border-primary" formControlName="annee"
                            placeholder="Ex: 2024" #requiredInput (blur)="onBlur()" maxlength="4" pattern="[0-9]*" />
                    </div>
                    <!-- FORMAT Field -->
                    <div class="col-md-4">
                        <label class="form-label">Format <span class="text-danger">*</span></label>
                        <select class="form-select border-primary" formControlName="format">
                            <option value="PDF">PDF</option>
                            <option value="EXCEL">EXCEL</option>
                        </select>
                    </div>
                    <!-- Action Button -->
                    <div class="col-md-4">
                        <button type="button" class="btn btn-primary w-100" (click)="handlePrint()">
                            <i class="ri-printer-line me-1"></i> Imprimer
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
