<div class="col-md-12 d-flex justify-content-center">
    <div style="width: 70%;"> <!-- Largeur du conteneur -->
      <div class="collapse show" id="paymentmethodCollapse">
        <div class="card p-4 border shadow-none mb-0 mt-4">
          <form
            action="javascript:void(0);"
            class="row g-3"
            [formGroup]="formAdherent"
          >
            <div class="row">
              <div class="col-md-12">
                <!-- Bloc 1 -->
                <div class="row">
                  <div class="row mt-3">
                    <!-- Champ Mois -->
                    <div class="col-md-2">
                      <label class="form-label">Date debut</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="dat_deb"
                        mask="00/00/0000"
                      />
                    </div>
                  <div class="col-md-5"></div>
                    <!-- Champ Année -->
                    <div class="col-md-2">
                        <label class="form-label">Date fin</label>
                        <input
                          type="text"
                          class="form-control"
                          formControlName="dat_fin"
                          mask="00/00/0000"
                        />
                      </div>
                  </div>
                  
                  <div class="col-md-2">
                    <label class="form-label">Matricule début</label>
                    <app-lov
                      [listData]="personnelList"
                      [columns]="columnsSearch"
                      codeField="mat_pers"
                      [selectedCode]="formAdherent.get('mat_pers')?.value"
                      (selectedValue)="onSelectedVMat($event)"
                    ></app-lov>
                  </div>
           
                  <div class="col-md-5">
                    <label class="form-label">Nom</label>
                    <input
                      type="text"
                      class="form-control"
                      formControlName="nom_deb"
                      readonly
                    />
                  </div>
                </div>
  
                <!-- Bloc 2 -->
                <div class="row mt-3">
                  <div class="col-md-2">
                    <label class="form-label">Matricule fin</label>
                    <app-lov
                      [listData]="personnelList"
                      [columns]="columnsSearch"
                      codeField="mat_pers"
                      [selectedCode]="formAdherent.get('mat_pers2')?.value"
                      (selectedValue)="onSelectedVMat2($event)"
                    ></app-lov>
                  </div>
           
                  <div class="col-md-5">
                    <label class="form-label">Nom</label>
                    <input
                      type="text"
                      class="form-control"
                      formControlName="nom_fin"
                      readonly
                    />
                  </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-2">
                      <label class="form-label">Nature d'indemnité</label>
                      <app-lov
                        [listData]="natDontList"
                        [columns]="columnsNatDon"
                        codeField="nat_don"
                         (selectedValue)="onSelectedNatDon($event)"
                      ></app-lov>
                    </div>
             
                    <div class="col-md-5">
                      <label class="form-label">Libelle</label>
                      <input
                        type="text"
                        class="form-control"
                        formControlName="lib_don"
                        readonly
                      />
                    </div>
                  </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
